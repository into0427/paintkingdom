function aiAcc(c) {                                // 정확도 = 0.8 × (1 − 0.62^(리그 번호+1)) + 지휘관 보정, 항상 15%~80%
  const i = Math.floor(SAVE.power / 100);
  let a = AI_ACC_MAX * (1 - Math.pow(0.62, i + 1)) + AI_ACC_BONUS;
  if (c.accFixed) a += .15;                        // 특별 지휘관은 정확도가 높음 (그래도 80% 상한)
  else { a += (c.acc || 0); if (c.accMul) a *= c.accMul; }
  return Math.max(AI_ACC_MIN, Math.min(AI_ACC_MAX, a));
}

let lastCmd = null;
function pickCommander() {                         // 내 리그에서 등장할 수 있는 지휘관 중 랜덤 (직전 지휘관은 피함)
  if (S.event) return specialCommander(S.event);
  const lg = Math.floor(SAVE.power / 100), pool = S.aiPool;
  let ok = COMMANDERS.filter(c => lg >= (c.min || 0) && (c.need || []).every(k => pool.includes(k)));
  if (ok.length > 1) ok = ok.filter(c => c.id !== lastCmd);
  let r = Math.random() * ok.reduce((t, c) => t + (c.w || 1), 0), pick = ok[0];
  for (const c of ok) { r -= (c.w || 1); if (r <= 0) { pick = c; break; } }
  lastCmd = pick.id;
  return pick;
}

function resolveDeck(def, pool, budget) {
  budget = budget || CFG.START_COIN;                  // 아직 열리지 않은 캐릭터는 비슷한 역할의 열린 캐릭터로 코인을 맞춰 대체
  const cost = k => CFG.UNITS[k].cost;
  const SUBS = { fire: ['knight'], assassin: ['knight'], witch: ['archer', 'knight'], mage: ['archer', 'knight'], castle: ['knight'], arma: ['knight'], flower: ['knight'], titan: ['knight'], launcher: ['archer', 'knight'], chicken: ['knight'], archer: ['knight'] };
  const cards = {}, place = {};
  for (const k in def.cards) {
    if (!CFG.UNITS[k]) continue;
    const t = pool.includes(k) ? k : ((SUBS[k] || []).find(x => pool.includes(x)) || 'knight');
    cards[t] = (cards[t] || 0) + (t === k ? def.cards[k] : Math.round(def.cards[k] * cost(k) / cost(t)));
    if (def.place && def.place[k] && !place[t]) place[t] = def.place[k];
  }
  const total = () => Object.keys(cards).reduce((s, k) => s + cards[k] * cost(k), 0);
  while (total() > budget) { const k = Object.keys(cards).filter(x => cards[x] > 0).sort((a, b) => cards[b] * cost(b) - cards[a] * cost(a))[0]; cards[k]--; }
  while (total() + cost('knight') <= budget) cards.knight = (cards.knight || 0) + 1;
  return { cards, place };
}

function counterScore(deck, mine) {                // 이 덱이 내 출전 목록을 얼마나 잘 카운터하는지 (코인 비중으로 가중 평균)
  let s = 0, tot = 0;
  for (const k in deck.cards) {
    const w = deck.cards[k] * CFG.UNITS[k].cost; tot += w;
    let m = 0; mine.forEach(y => { m += (COUNTER[k] && COUNTER[k][y]) || 0; });
    s += w * (mine.length ? m / mine.length : 0);
  }
  return tot ? s / tot : 0;
}
function bestCounterDeck() {
  const mine = SEL.filter(k => SAVE.owned.includes(k));
  return Object.keys(DECKS).map(id => ({ id, s: counterScore(resolveDeck(DECKS[id], S.aiPool), mine) + Math.random() * .25 })).sort((a, b) => b.s - a.s)[0].id;
}

function specFor(type, deck) {                     // 이 캐릭터의 정석 배치 규칙 (+ 증강에 따른 배치 변화)
  const base = ZONE[type] || (CFG.UNITS[type].range > 0 ? ZONE.archer : ZONE.knight);
  const sp = Object.assign({}, base, (deck.place && deck.place[type]) || {});
  const au = S.aiAugs || {}, has = (k, n) => (au[k] || []).includes(n);
  S.augUse = S.augUse || {};
  const skill = key => (key in S.augUse) ? S.augUse[key] : (S.augUse[key] = Math.random() < S.acc);   // 정확도가 높을수록 증강을 살리는 배치를 더 잘 해요
  if (type === 'flower' && !sp.behind) sp.behind = ['titan', 'arma', 'knight'];                       // 꽃순이는 사거리가 짧아서 탱커 바로 뒤에
  if (deck.cards.titan && has('titan', 4) && ['fire', 'flower', 'assassin'].includes(type) && skill('titanGuard')) sp.behind = 'titan';   // 타이탄 4증강(아군 보호): 뒤에 모아둠
  if (type === 'knight' && has('knight', 2) && skill('knightTight')) sp.tight = true;                                                     // 기사 2증강(집단지성): 바짝 붙임
  if (sp.group) sp.tight = true;
  return sp;
}

function layout(n, sp, type) {                     // 한 종류 n마리의 정석 위치들
  const span = MID - 36, yOf = d => MID - 16 - d * span, rr = CFG.UNITS[type].r, pts = [];
  if (sp.behind) {                                 // 지정한 캐릭터(예: 타이탄) 바로 뒤에 모아서
    let ref = [];
    for (const bt of [].concat(sp.behind)) { ref = S.units.filter(u => u.team === 2 && u.type === bt); if (ref.length) break; }   // 첫 번째로 있는 탱커 뒤에
    if (ref.length) {
      const cx = ref.reduce((t, u) => t + u.x, 0) / ref.length, cy = Math.min.apply(null, ref.map(u => u.y)), st = 2 * rr + 4;
      for (let i = 0; i < n; i++) pts.push([cx + ((i % 4) - 1.5) * st, cy - 30 - Math.floor(i / 4) * st]);
      return pts;
    }
  }
  const x0 = sp.x[0], x1 = sp.x[1], d0 = sp.d[0], d1 = sp.d[1], wpx = (x1 - x0) * W;
  if (sp.form === 'line' || sp.form === 'arc') {   // 일렬 / 학익진(양 끝이 앞으로 나온 반달 모양)
    for (let i = 0; i < n; i++) {
      const f = n === 1 ? .5 : i / (n - 1);
      const d = sp.form === 'arc' ? d1 - (d1 - d0) * Math.pow(Math.abs(f - .5) * 2, 2) : (d0 + d1) / 2;
      pts.push([(x0 + (x1 - x0) * f) * W, yOf(d)]);
    }
    return pts;
  }
  const dpx = Math.max(10, (d1 - d0) * span), minSt = 2 * rr + 4;
  const st = sp.tight ? minSt : Math.max(minSt, Math.min(46, Math.sqrt(wpx * dpx / n)));
  const cols = sp.group ? Math.min(n, 3) : Math.max(1, Math.min(n, Math.floor(wpx / st) + 1));
  const cx = sp.group ? (x0 + Math.random() * (x1 - x0)) * W : (x0 + x1) / 2 * W;
  for (let i = 0; i < n; i++) {
    const row = Math.floor(i / cols), inRow = Math.min(cols, n - row * cols), col = i % cols;
    pts.push([cx + (col - (inRow - 1) / 2) * st + (Math.random() - .5) * 4, yOf(d0) - row * st * .9]);
  }
  return pts;
}

function freeSpot(x, y, r) {                       // 다른 AI 캐릭터와 겹치면 바깥쪽으로 조금씩 밀어서 빈 자리 찾기
  const ok = (px, py) => !S.units.some(u => u.team === 2 && Math.hypot(u.x - px, u.y - py) < r + u.d.r + 1);
  const cX = v => Math.min(W - r, Math.max(r, v)), cY = v => Math.min(MID - r, Math.max(r, v));
  x = cX(x); y = cY(y);
  if (ok(x, y)) return [x, y];
  for (let k = 1; k < 40; k++) for (let a = 0; a < 8; a++) {
    const ang = a * TAU / 8 + k, px = cX(x + Math.cos(ang) * k * 5), py = cY(y + Math.sin(ang) * k * 5);
    if (ok(px, py)) return [px, py];
  }
  return [x, y];
}

function placeDeck(deck, acc) {                    // 덱을 소환해서 배치: 유닛마다 정확도 확률로 정석 위치, 아니면 아무 곳
  const ORD = ['titan', 'arma', 'castle', 'knight', 'fire', 'flower', 'assassin', 'launcher', 'archer', 'witch', 'mage', 'chicken'];
  const ord = k => { const i = ORD.indexOf(k); return i < 0 ? 50 : i; };
  Object.keys(deck.cards).filter(k => deck.cards[k] > 0).sort((a, b) => ord(a) - ord(b)).forEach(type => {
    const n = deck.cards[type], r = CFG.UNITS[type].r, pts = layout(n, specFor(type, deck), type);
    for (let i = 0; i < n; i++) {
      let x = pts[i][0], y = pts[i][1];
      if (!(Math.random() < acc)) { const q = pickSpot(2, type, 20, MID - 20); x = q[0]; y = q[1]; }   // 실수: 엉뚱한 자리
      const f = freeSpot(x, y, r);
      spawn(2, type, f[0], f[1]);
    }
  });
}

function aiPrep() {                                // 준비 시간에 AI가 덱을 정하고 증강을 배분하고 배치
  const c = S.cmd; S.deckName = '즉흥 덱';
  if (c.decks.length && (c.event || Math.random() < S.acc)) {
    const id = c.scout ? bestCounterDeck() : c.decks[Math.floor(Math.random() * c.decks.length)];
    const def = c.deckDef || DECKS[id];
    S.deckName = def.name;
    const deck = resolveDeck(def, S.aiPool, c.budget);
    S.aiAugs = rollAiAugs(Object.keys(deck.cards));
    placeDeck(deck, S.acc);
    S.coin[1] = 0;
    return;
  }
  S.aiAugs = rollAiAugs(null);
  while (aiBuyOne()) {}                            // 정석을 못 따른 경우: 예전처럼 랜덤으로 사서 아무 데나 배치
}

/* ====================================================
   특별 AI 이벤트 (특별 지휘관) + 전투 중 AI 운영
   ==================================================== */
const EVENT_CHANCE = 0.06;                         // 판마다 특별 지휘관이 나올 확률
const EVENT_MIN_GAP = 3, EVENT_MAX_GAP = 30;       // 직전 이벤트 뒤 최소 몇 판 쉬고, 최대 몇 판 안에는 꼭 나오게 할지
const EVENT_MIN_POWER = 100;                       // 이 통솔력부터 등장
const EVENT_AUG_MULT = 1.6;                        // 증강 마스터: 평균 플레이어 증강 수의 몇 배 (2는 너무 빡셀 수 있어요)
const EVENT_HORDE_BUDGET = 40;                     // 컨셉 군단: AI 시작 코인
const EVENT_PALETTES = { aug: 3, horde: 2 };       // 이기면 받는 팔레트 수
const EVENT_WEIGHTS = { aug: 1, horde: 1 };        // 종류별 등장 비율 (새 이벤트는 여기에 추가)
const EVENT_NAMES = { aug: ['증강 박사 에디', '무장 장군 아테나'], horde: ['군단의 제왕 레기온', '물량의 신 하데스'] };
// 컨셉 군단 덱: key 캐릭터가 열려 있어야 나와요 (코인 합 40)
const HORDES = [
  { key: 'knight',   name: '기사 대군',        cards: { knight: 40 } },
  { key: 'archer',   name: '궁수 대군',        cards: { archer: 20 }, place: { archer: { d: [.66, .86], x: [.05, .95], form: 'arc' } } },
  { key: 'castle',   name: '캐슬 군단',        cards: { castle: 6, knight: 10 }, place: { castle: { d: [.36, .58], x: [.08, .92] } } },
  { key: 'mage',     name: '마법사 군단',      cards: { mage: 8, witch: 2, knight: 2 } },
  { key: 'chicken',  name: '런치킨 떼',        cards: { chicken: 10, knight: 10 } },
  { key: 'titan',    name: '타이탄 군단',      cards: { titan: 8, flower: 2 } },
  { key: 'launcher', name: '런처 포대',        cards: { launcher: 6, fire: 3, knight: 7 } },
  { key: 'arma',     name: '아르마딜로 돌격대', cards: { arma: 10, knight: 10 } }
];

function rollEvent() {                             // 이번 판에 특별 지휘관이 나올지 판정
  const gap = Number(SAVE.evGap) || 0;
  if (SAVE.power < EVENT_MIN_POWER || gap < EVENT_MIN_GAP || !(gap >= EVENT_MAX_GAP || Math.random() < EVENT_CHANCE)) { SAVE.evGap = gap + 1; persist(); return null; }
  SAVE.evGap = 0; persist();
  const kinds = Object.keys(EVENT_WEIGHTS);
  let r = Math.random() * kinds.reduce((t, k) => t + EVENT_WEIGHTS[k], 0), type = kinds[0];
  for (const k of kinds) { r -= EVENT_WEIGHTS[k]; if (r <= 0) { type = k; break; } }
  const desc = type === 'aug' ? `증강을 잔뜩 단 지휘관! (증강 수 ×${EVENT_AUG_MULT})` : `${EVENT_HORDE_BUDGET}코인으로 시작하는 군단 지휘관!`;
  return { type, pal: EVENT_PALETTES[type], desc };
}

function specialCommander(ev) {
  const names = EVENT_NAMES[ev.type], name = names[Math.floor(Math.random() * names.length)];
  if (ev.type === 'horde') {
    const hs = HORDES.filter(h => S.aiPool.includes(h.key)), h = hs[Math.floor(Math.random() * hs.length)];
    S.coin[1] = EVENT_HORDE_BUDGET;
    return { id: 'ev-horde', name, style: h.name, decks: ['horde'], deckDef: h, budget: EVENT_HORDE_BUDGET, accFixed: true, event: 'horde' };
  }
  const lg = Math.floor(SAVE.power / 100);         // 증강 마스터: 평범한 지휘관의 덱을 쓰되 증강이 훨씬 많음
  const base = COMMANDERS.filter(c => c.id !== 'chaos' && lg >= (c.min || 0) && (c.need || []).every(k => S.aiPool.includes(k)));
  return Object.assign({}, base[Math.floor(Math.random() * base.length)], { name, event: 'aug', accFixed: true });
}

const LATE_GOOD = ['archer', 'knight', 'titan', 'assassin', 'launcher', 'fire', 'chicken'];   // 후반에 즉각 승부를 내는 카드
const LATE_BAD = ['castle', 'mage', 'witch', 'flower'];                                       // 라인전용 카드는 후반에 도움이 적음

function cardScore(k, st) {                        // 지금 상황에서 이 카드를 내는 게 얼마나 좋은지
  const D = CFG.UNITS[k]; let s = 0, w = 0, m = 0;
  for (const u of st.foes) { const q = u.d.cost || 1; w += q; m += q * ((COUNTER[k] && COUNTER[k][u.type]) || 0); }
  if (w) s += 1.2 * m / w;                                                                    // 살아있는 상대 구성에 맞는 카운터
  const hasL = st.foes.some(u => u.type === 'launcher'), myL = st.mine.some(u => u.type === 'launcher');
  if (hasL && COUNTER[k] && COUNTER[k].launcher > 0) s += .8;                                 // 상대 런처는 카운터로 부수기
  if (!hasL && D.range > 0) s += .4;                                                          // 상대에 런처가 없으면 원거리로 장악
  if (myL && (k === 'archer' || k === 'witch')) s += .5;                                      // 내 런처를 지키는 원거리
  if (st.el >= 40) {
    if (LATE_GOOD.includes(k)) s += .6;
    if (LATE_BAD.includes(k)) s -= .8;
    if (st.lead > .05 && k === 'chicken') s += 1;                                             // 이기고 있으면 런치킨으로 색칠 굳히기
  } else if (st.el > 25 && st.lead > .05 && k === 'chicken') s += .5;
  s += .25 * ((S.aiAugs[k] || []).length);                                                    // 증강이 많은 카드를 더 잘 활용
  return s - .06 * D.cost + (Math.random() - .5) * .5;
}

function aiBattle() {                              // 전투 중 AI 운영: 초반엔 아끼고, 상황 보고 카운터 소환, 후반엔 아낌없이
  if (S.phase !== 'battle') return;
  if (!(Math.random() < S.acc)) { if (Math.random() < .5 / incomeEvery()) aiBuyOne(); return; }   // 정석을 놓친 순간: 즉흥 소환
  const el = CFG.BATTLE - S.t;
  if (el > 57) return;                                                                         // 마지막 순간의 소환은 의미가 없어요
  let a = 0, b = 0;
  for (const t of S.owner) { if (t === 1) a++; else if (t === 2) b++; }
  const lead = (a + b) ? (b - a) / (a + b) : 0;                                                // AI 기준 점유율 우세(+) / 열세(−)
  const foes = S.units.filter(u => u.team === 1 && u.hp > 0 && u.type !== 'egg'), mine = S.units.filter(u => u.team === 2 && u.hp > 0 && u.type !== 'egg');
  const crisis = foes.filter(u => u.y < MID - 25).length;                                      // 내 진영 안으로 들어온 적 수
  const need = crisis >= 3 ? 1 : el >= 40 ? 1 : el < 20 ? 8 : lead > .05 ? 8 : lead < -.05 ? 6 : 5;   // 이만큼 모이면 쓰기 시작
  const st = { el, lead, foes, mine };
  const chickenFirst = el > 25 && el < 40 && lead > .05 && S.coin[1] >= CFG.UNITS.chicken.cost && Math.random() < .3 && S.aiPool.includes('chicken');
  if (!chickenFirst && S.coin[1] < need) return;
  for (let n = 0; n < 4; n++) {
    const opts = Object.keys(CFG.UNITS).filter(k => S.aiPool.includes(k) && CFG.UNITS[k].cost <= S.coin[1]);
    if (!opts.length) break;
    const k = (chickenFirst && n === 0) ? 'chicken' : opts.map(x => ({ x, s: cardScore(x, st) })).sort((p, q) => q.s - p.s)[0].x;
    S.coin[1] -= CFG.UNITS[k].cost;
    const q = pickSpot(2, k, 18, 40);
    spawn(2, k, q[0], q[1]);
    if (S.coin[1] < need - 2 && el < 40) break;                                                // 필요한 만큼만 쓰고 멈춤
  }
}

function endRoll(u) { u.rs = 'cool'; u.cd = u.d.cool; if (u.au && u.au.includes(4)) u.shield = Math.min(u.shMax, u.shield + 50); }   // 재충전

function titanGuard() {                            // 타이탄 아군 보호: 전투 시작 때 타이탄 한 마리당 후방 아군 최대 4명에게 1회 방어 쉴드
  for (const t of S.units) {
    if (t.type !== 'titan' || !t.au || !t.au.includes(4)) continue;
    S.units.filter(o => o !== t && o.team === t.team && o.type !== 'titan' && o.hp > 0 && !o.guarded
        && Math.hypot(o.x - t.x, o.y - t.y) <= 100 && (t.team === 1 ? o.y >= t.y : o.y <= t.y))
      .sort((p, q) => Math.hypot(p.x - t.x, p.y - t.y) - Math.hypot(q.x - t.x, q.y - t.y))
      .slice(0, 4)
      .forEach(o => { o.guarded = true; o.shield = (o.shield || 0) + 1; o.shMax = Math.max(o.shMax || 0, o.shield); });
  }
}

function processDeaths() {                         // 죽은 캐릭터 처리 (흡혈, 자폭, 마녀의 유언)
  for (const u of S.units) {
    if (u.hp > 0 || u.dead) continue;
    u.dead = true;
    if (u.team === 1 && u.card) S.stats.deaths[u.type] = (S.stats.deaths[u.type] || 0) + 1;
    if (u.team === 2 && u.type !== 'egg' && u.lastHit && u.lastHit.team === 1) { S.stats.kills[u.lastHit.type] = (S.stats.kills[u.lastHit.type] || 0) + 1; S.stats.killsTotal++; }
    const k = u.lastHit;
    if (k && k.hp > 0 && k.vamp) k.hp = Math.min(k.max, k.hp + k.max * k.vamp);
    if (!u.au) continue;
    if (u.type === 'titan' && u.au.includes(5)) {
      for (const e of S.units) if (e.team !== u.team && e.hp > 0 && Math.hypot(e.x - u.x, e.y - u.y) <= 120) hurt(e, 50, true, null);
      for (let i = 0; i < 45; i++) { const a = Math.random() * TAU, r = 120 * Math.sqrt(Math.random()); paint(u.x + Math.cos(a) * r, u.y + Math.sin(a) * r, 3, u.team); }
      S.fx.push({ x: u.x, y: u.y, t: 0, team: u.team, r: 40 });
    }
    if (u.type === 'witch' && u.au.includes(1)) {
      paint(u.x, u.y, u.d.zone, u.team);
      S.zones.push({ x: u.x, y: u.y, r: u.d.zone, team: u.team, t: u.d.zoneTime, amp: u.au.includes(4) ? .1 : 0 });
    }
  }
}

function drawMinion(u, c) {                        // 졸병: 눈알 달린 페인트볼
  const x = u.x, y = u.y, r = u.d.r, lk = Math.sin(clock * 3 + u.seed) * .7;
  ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.beginPath(); ctx.ellipse(x - r * .4, y - r * .5, r * .28, r * .18, -.6, 0, TAU); ctx.fill();
  [-3.2, 3.2].forEach(o => {
    ctx.fillStyle = '#fff'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.arc(x + o, y + 1, 3.4, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(x + o + lk, y + 1.5, 1.4, 0, TAU); ctx.fill();
  });
}

/* ====================================================
   팔레트 열기 연출
   ==================================================== */
const pal = { phase: 'idle', t: 0, res: null, shown: false, parts: [], rings: [], flash: 0, last: 0 };
const RAR = { new: '#ffd84d', dup: '#7dd3fc', jack: '#ff9ff3', '': '#a7f3d0' };
function palReset() { pal.phase = 'idle'; pal.t = 0; pal.res = null; pal.shown = false; pal.parts = []; pal.rings = []; pal.flash = 0; palBusy = false; }
const palCols = () => COLORS.filter(c => c.hex).map(c => c.hex).concat(['#ffd84d', '#ffffff']);

function palBurst(cx, cy, col) {                   // 열리는 순간: 물감 방울 폭발 + 충격파 + 번쩍임
  const cols = palCols().concat([col, col]);
  for (let i = 0; i < 100; i++) {
    const a = Math.random() * TAU, sp = 120 + Math.random() * 380;
    pal.parts.push({ x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 140, r: 3 + Math.random() * 7, c: cols[i % cols.length], life: 1 + Math.random() * .9 });
  }
  pal.rings.push({ x: cx, y: cy, t: 0, c: col }, { x: cx, y: cy, t: -.12, c: '#ffffff' });
  pal.flash = 1;
}

function drawPal() {
  const cv2 = $('pcv'), g = cv2.getContext('2d'), Wc = cv2.width, Hc = cv2.height, cx = Wc / 2, cy = Hc / 2 + 4;
  const dt = Math.min(.05, clock - (pal.last || clock)); pal.last = clock; pal.t += dt;
  g.clearRect(0, 0, Wc, Hc);
  if (pal.phase === 'open' && pal.t >= 1.1) {      // 열림!
    SAVE.palettes--; pal.res = rollPalette(); persist();
    pal.phase = 'reveal'; pal.t = 0; palBurst(cx, cy, RAR[pal.res.cls] || RAR['']);
  }
  const col = pal.res ? (RAR[pal.res.cls] || RAR['']) : '#ffd84d';
  const glow = pal.phase === 'open' ? Math.min(1, pal.t / 1.1) : pal.phase === 'reveal' ? Math.max(.4, 1 - pal.t * .25) : 0;
  if (glow > 0) {                                  // 뒤에서 도는 빛줄기
    g.save(); g.translate(cx, cy); g.rotate(clock * (pal.phase === 'open' ? 1.8 : .5)); g.fillStyle = pal.phase === 'reveal' ? col : '#ffd84d'; g.globalAlpha = .22 * glow;
    for (let k = 0; k < 14; k++) { g.rotate(TAU / 14); g.beginPath(); g.moveTo(0, 0); g.lineTo(-18, -Hc); g.lineTo(18, -Hc); g.closePath(); g.fill(); }
    g.restore(); g.globalAlpha = 1;
  }
  if (pal.phase !== 'reveal' || pal.t < .25) {     // 팔레트 본체 (대기 중엔 둥실, 열리는 중엔 점점 더 흔들림)
    const out = pal.phase === 'reveal' ? 1 - pal.t / .25 : 1, op = pal.phase === 'open';
    const sh = op ? (Math.random() - .5) * (3 + pal.t * 14) : 0, sc = (1 + (op ? pal.t * .25 : Math.sin(clock * 2) * .03)) * Math.max(0, out);
    g.save(); g.globalAlpha = Math.max(0, out); g.translate(cx + sh, cy - 6 + (op ? 0 : Math.sin(clock * 2.4) * 6)); g.rotate(-.18 + Math.sin(clock * 1.6) * .05 + sh * .01); g.scale(sc, sc);
    g.lineJoin = 'round'; g.lineWidth = 6; g.strokeStyle = '#6b3f1d'; g.fillStyle = '#e8b27a';
    g.beginPath(); g.ellipse(0, 0, 110, 78, 0, 0, TAU); g.fill(); g.stroke();
    g.fillStyle = '#f3c995'; g.beginPath(); g.ellipse(-12, -14, 82, 50, 0, 0, TAU); g.fill();
    g.fillStyle = '#2b3060'; g.lineWidth = 4; g.beginPath(); g.ellipse(-58, 26, 17, 13, .3, 0, TAU); g.fill(); g.stroke();
    [['#ff3d6e', -66, -34], ['#ffd84d', -26, -56], ['#34d399', 24, -58], ['#2f6bff', 68, -28], ['#a855f7', 74, 20], ['#ff8a1f', 36, 52]].forEach((b, i) => {
      const q = 1 + Math.sin(clock * 3 + i) * .08 * (op ? 3 : 1);
      g.fillStyle = b[0]; g.lineWidth = 3; g.beginPath(); g.ellipse(b[1], b[2], 17 * q, 14 * q, i, 0, TAU); g.fill(); g.stroke();
      g.fillStyle = 'rgba(255,255,255,.55)'; g.beginPath(); g.ellipse(b[1] - 5, b[2] - 5, 5, 3, -.6, 0, TAU); g.fill();
    });
    g.restore(); g.globalAlpha = 1;
  }
  if (pal.phase !== 'reveal') {                    // 반짝이 / 열리는 중엔 물감 방울이 튀어 오름
    g.fillStyle = '#fff';
    for (let i = 0; i < 6; i++) { const a = clock * .8 + i * 1.05, r = 120 + Math.sin(clock * 3 + i) * 10, sz = 3 + Math.abs(Math.sin(clock * 4 + i * 2)) * 3; g.globalAlpha = .6; g.beginPath(); g.arc(cx + Math.cos(a) * r, cy + Math.sin(a) * r * .75, sz, 0, TAU); g.fill(); }
    g.globalAlpha = 1;
    if (pal.phase === 'open' && Math.random() < .6) { const cc = palCols(); pal.parts.push({ x: cx + (Math.random() - .5) * 160, y: cy - 30, vx: (Math.random() - .5) * 90, vy: -170 - Math.random() * 150, r: 3 + Math.random() * 3, c: cc[Math.floor(Math.random() * cc.length)], life: .8 }); }
  } else {                                         // 결과 공개: 아이콘이 통! 하고 커지며 등장
    const t = pal.t;
    if (t > .35 && !pal.shown) { pal.shown = true; $('palres').innerHTML = `<b class="${pal.res.cls}">${pal.res.title}</b><small>${pal.res.sub}</small>`; palUI(); }
    if (t > 1.2 && palBusy) { palBusy = false; palUI(); }
    const k = t < .25 ? 0 : Math.min(1, (t - .25) / .4), s2 = k ? 1 + 2.70158 * Math.pow(k - 1, 3) + 1.70158 * Math.pow(k - 1, 2) : 0;

      g.globalAlpha = .75; g.fillStyle = gr; g.beginPath(); g.arc(cx, cy, 120 * s2, 0, TAU); g.fill(); g.globalAlpha = 1;
      if (pal.res.unit && CFG.UNITS[pal.res.unit]) drawUnitBig(g, pal.res.unit, cx, cy + 6, 3.4 * s2);      // 캐릭터는 인게임 모습 그대로
      else { g.font = `${100 * s2}px "Apple Color Emoji","Segoe UI Emoji",sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(pal.res.icon, cx, cy + 4); }
      g.fillStyle = '#fff';
      for (let i = 0; i < 8; i++) { const a = clock * .7 + i * TAU / 8, r = (88 + Math.sin(clock * 4 + i) * 8) * s2, sz = 5 + Math.abs(Math.sin(clock * 5 + i)) * 4; g.beginPath(); g.moveTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r - sz); g.lineTo(cx + Math.cos(a) * r + sz * .4, cy + Math.sin(a) * r); g.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r + sz); g.lineTo(cx + Math.cos(a) * r - sz * .4, cy + Math.sin(a) * r); g.closePath(); g.fill(); }
    }
  }
  for (const q of pal.parts) {                     // 물감 방울
    q.vy += 620 * dt; q.x += q.vx * dt; q.y += q.vy * dt; q.life -= dt;

  }
  pal.parts = pal.parts.filter(q => q.life > 0 && q.y < Hc + 20);
  for (const r of pal.rings) {                     // 충격파
    r.t += dt;
    if (r.t > 0) { g.globalAlpha = Math.max(0, 1 - r.t / .6); g.strokeStyle = r.c; g.lineWidth = 6 * (1 - r.t / .6) + 1; g.beginPath(); g.arc(r.x, r.y, r.t * 380, 0, TAU); g.stroke(); }

  pal.rings = pal.rings.filter(r => r.t < .6);
  g.globalAlpha = 1;
  if (pal.flash > 0) { g.fillStyle = `rgba(255,255,255,${pal.flash * .85})`; g.fillRect(0, 0, Wc, Hc); pal.flash = Math.max(0, pal.flash - dt * 3); }
}

const todayStr = () => { const t = new Date(); return `${t.getFullYear()}-${t.getMonth() + 1}-${t.getDate()}`; };
function newMission(slot, excl, rr) {              // 가진 캐릭터로 깰 수 있는 미션 중 하나를 랜덤으로 뽑음
  const shown = SAVE.missions.map(m => m && m.id);
  const el = MISSIONS.filter(m => (m.req || []).every(k => CFG.UNITS[k] && SAVE.owned.includes(k)) && (!m.need || m.need(SAVE.owned)));
  let pool = el.filter(m => m.id !== excl && !shown.includes(m.id));
  if (!pool.length) pool = el.filter(m => m.id !== excl);
  if (!pool.length) pool = el;
  const m = pool[Math.floor(Math.random() * pool.length)];
  return { id: m.id, prog: 0, rr: rr || '' };
}
function fillMissions() {
  for (let i = 0; i < 3; i++) if (!SAVE.missions[i] || !MISSIONS.some(m => m.id === SAVE.missions[i].id)) SAVE.missions[i] = newMission(i, null, SAVE.missions[i] && SAVE.missions[i].rr);
  SAVE.missions.length = 3; persist();
}
function missionCtx(a, b) {
  const st = S.stats;
  return { win: a > b, loss: a < b, a, b, d: (a + b) ? Math.abs(a - b) / (a + b) : 0, st, enemyAlive: S.units.filter(u => u.team === 2 && u.hp > 0 && u.type !== 'egg').length };
}
function evalMissions(c) {                         // 전투가 끝날 때 미션 3개를 검사, 완료하면 보석 지급 후 새 미션으로 교체
  const done = [];
  SAVE.missions.forEach(m => {
    const def = MISSIONS.find(x => x.id === m.id); if (!def) return;
    let ok;
    if (def.type === 'streak') { m.prog = c.win ? (m.prog || 0) + 1 : c.loss ? 0 : (m.prog || 0); ok = m.prog >= def.target; }
    else if (def.type === 'sum') { m.prog = (m.prog || 0) + def.val(c); ok = m.prog >= def.target; }
    else ok = !!def.ok(c);
    if (ok) done.push(def);
  });
  done.forEach(def => {
    SAVE.gems += MISSION_GEMS[def.lv - 1];
    const i = SAVE.missions.findIndex(m => m.id === def.id);
    SAVE.missions[i] = newMission(i, def.id, SAVE.missions[i].rr);
  });
  return done;
}
function rerollMission(i) {                        // 칸마다 하루에 한 번 무료로 다시 뽑기
  const m = SAVE.missions[i];
  if (m.rr === todayStr()) return;
  SAVE.missions[i] = newMission(i, m.id, todayStr()); persist(); buildMissions();
}
function buildMissions() {
  const box = $('mlist'); box.innerHTML = '';
  SAVE.missions.forEach((m, i) => {
    const def = MISSIONS.find(x => x.id === m.id); if (!def) return;
    const row = document.createElement('div'); row.className = 'mrow';
    row.innerHTML = `<div class="mt"><b>${def.txt}</b><span>${'★'.repeat(def.lv)} · 💎 ${MISSION_GEMS[def.lv - 1]}${def.target ? ` · 진행 ${m.prog || 0}/${def.target}` : ''}</span></div>`;
    const b = document.createElement('button'), used = m.rr === todayStr();
    b.className = 'mre'; b.textContent = used ? '🔄 오늘은 사용함 (내일 초기화)' : '🔄 바꾸기'; b.disabled = used;
    b.onclick = () => rerollMission(i);
    row.appendChild(b); box.appendChild(row);
  });
}
fillMissions();
$('bMis').onclick = () => { buildMissions(); show('missions'); };
$('mback').onclick = () => show('home');

/* ====================================================
   캐릭터 그림(이모지 대신) / 배경음악 / 설정 / 백업
   ==================================================== */
function drawUnitBig(g, type, x, y, sc) {          // 인게임 캐릭터 모습을 다른 캔버스(g)에 크게/작게 그리기
  const d = CFG.UNITS[type]; if (!d) return;
  const old = ctx, k = 12 / Math.max(12, d.r);
  ctx = g; g.save(); g.translate(x, y); g.scale(sc * k, sc * k);
  try { drawUnit({ team: 1, type, d, x: 0, y: 0, hp: d.hp, max: d.hp, shield: 0, inv: 0, hit: 0, stun: 0, rs: 'walk', spray: false, nobar: true, seed: 1, face: -.3 }); }
  finally { g.restore(); ctx = old; }
}
function mkIcon(type, px) {                        // 버튼/카드에 넣는 작은 캐릭터 그림
  const c = document.createElement('canvas'), n = px * 2;
  c.width = c.height = n; c.style.width = c.style.height = px + 'px';
  drawUnitBig(c.getContext('2d'), type, n / 2, n / 2 + n * .06, n / 46);
  return c;
}

// 배경음악 파일: index.html과 같은 곳(저장소 맨 위)에 main.mp3 / prep.mp3 / battle.mp3 를 올리면 돼요. 안 보이면 audio 폴더, 그다음 원래 이름(main_mp3.mp3 등)도 찾아봐요
const BGM = { home: ['main.mp3', 'audio/main.mp3', 'main_mp3.mp3'], prep: ['prep.mp3', 'audio/prep.mp3', 'prep_mp3.mp3'], battle: ['battle.mp3', 'audio/battle.mp3', 'battle_mp3.mp3'] };
const SND = { music: true, vol: .6 };
try { Object.assign(SND, JSON.parse(localStorage.getItem('pk_snd') || '{}')); } catch (e) {}
if (!(SND.vol >= 0 && SND.vol <= 1)) SND.vol = .6;
const saveSnd = () => store('pk_snd', JSON.stringify(SND));
const IS_IOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const bgm = {}; let bgmWant = 'home', audioOn = false, actx = null;
for (const k in BGM) {
  const list = BGM[k], a = new Audio(); a.loop = true; a.preload = 'metadata'; a.volume = 0;
  const t = { a, v: 0, bad: false, gain: null, i: 0 };
  a.addEventListener('error', () => {              // 파일을 못 찾으면 다음 후보 이름으로 다시 시도
    if (t.i + 1 < list.length) { t.i++; a.src = list[t.i]; a.load(); } else t.bad = true;
  });
  a.src = list[0];
  bgm[k] = t;
}
function unlockAudio() {                           // 브라우저 규칙: 첫 터치 뒤에야 소리를 낼 수 있어요
  if (audioOn) return; audioOn = true;
  if (IS_IOS) {                                    // 아이폰은 audio.volume이 안 먹어서 WebAudio로 볼륨 조절
    try {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      for (const k in bgm) { const t = bgm[k]; t.gain = actx.createGain(); t.gain.gain.value = 0; actx.createMediaElementSource(t.a).connect(t.gain); t.gain.connect(actx.destination); }
      actx.resume();
    } catch (e) { for (const k in bgm) bgm[k].gain = null; }
  }
  for (const k in bgm) { const t = bgm[k]; t.a.play().then(() => { if (!(t.v > .001)) t.a.pause(); }).catch(() => {}); }
}
['pointerdown', 'keydown', 'touchend'].forEach(ev => document.addEventListener(ev, unlockAudio, { passive: true }));

function bgmTick(dt) {                             // 화면에 맞는 곡으로 부드럽게 바꿔요 (메인 / 전투 전 / 전투 중)
  bgmWant = screen === 'game' ? (S.phase === 'prep' ? 'prep' : S.phase === 'battle' ? 'battle' : 'home') : 'home';
  for (const k in bgm) {
    const t = bgm[k]; if (t.bad) continue;
    const goal = (audioOn && SND.music && bgmWant === k && !document.hidden) ? SND.vol : 0;
    t.v += Math.sign(goal - t.v) * Math.min(Math.abs(goal - t.v), dt * 1.2);
    if (t.gain) t.gain.gain.value = t.v; else t.a.volume = Math.max(0, Math.min(1, t.v));
    if (t.v > .001 && t.a.paused) t.a.play().catch(() => {});
    else if (t.v <= .001 && goal === 0 && !t.a.paused) t.a.pause();
  }
}

function renderSnd() {
  $('sMusic').textContent = SND.music ? '🔊 배경음악 켜짐' : '🔇 배경음악 꺼짐';
  $('hMute').textContent = SND.music ? '🔊' : '🔇';
  $('sVol').value = Math.round(SND.vol * 100); $('sVolN').textContent = Math.round(SND.vol * 100);
  const bad = Object.keys(BGM).filter(k => bgm[k].bad).map(k => BGM[k][0]);
  $('sNote').textContent = bad.length ? `⚠ 찾지 못한 파일: ${bad.join(', ')}` : `음악 파일: ${Object.values(BGM).map(l => l[0]).join(' · ')}`;
}
function toggleMusic() { SND.music = !SND.music; saveSnd(); renderSnd(); }
$('sMusic').onclick = toggleMusic;
$('hMute').onclick = toggleMusic;
$('sVol').oninput = e => { SND.vol = e.target.value / 100; saveSnd(); renderSnd(); };
$('bSet').onclick = () => { renderSnd(); $('bk').value = ''; $('bkHint').textContent = ''; show('settings'); };
$('sdone2').onclick = () => show('home');
renderSnd();

function bkHint(t) { $('bkHint').textContent = t; }
$('bkOut').onclick = () => {                       // 저장 데이터를 글자 한 줄(백업 코드)로 만들어요
  const data = { v: 1, save: SAVE, nick: NICK, color: myColor, colors: UNLOCKED, sel: SEL };
  const bytes = new TextEncoder().encode(JSON.stringify(data)); let bin = '';
  bytes.forEach(b => { bin += String.fromCharCode(b); });
  const code = btoa(bin);
  $('bk').value = code; $('bk').select();
  bkHint('백업 코드를 만들었어요. 전체를 복사해서 메모장이나 메신저에 보관하세요');
  try { if (navigator.clipboard) navigator.clipboard.writeText(code).then(() => bkHint('복사했어요! 메모장이나 메신저에 붙여넣어 보관하세요')).catch(() => {}); } catch (e) {}
};
$('bkIn').onclick = () => {
  const code = $('bk').value.trim();
  if (!code) { bkHint('붙여넣은 코드가 없어요'); return; }
  try {
    const bytes = Uint8Array.from(atob(code), c => c.charCodeAt(0)), d = JSON.parse(new TextDecoder().decode(bytes));
    if (!d || d.v !== 1 || !d.save || typeof d.save !== 'object') throw new Error('bad');
    if (!confirm('지금 저장된 데이터가 백업 데이터로 바뀌어요. 계속할까요?')) return;
    store('pk_save', JSON.stringify(d.save)); store('pk_nick', d.nick || ''); store('pk_color', d.color || '');
    store('pk_colors', JSON.stringify(d.colors || [])); store('pk_sel', JSON.stringify(d.sel || []));
    location.reload();
  } catch (e) { bkHint('올바른 백업 코드가 아니에요'); }
};

/* ====================================================
   금속 광택 / 로딩 화면 / 결과 화면 1 / 버전
   ==================================================== */
const VERSION = '2026.11.21-C';                    // 설정 화면에 표시돼요 (업데이트가 반영됐는지 확인용)
$('sVer').textContent = '버전 ' + VERSION;

function shineUnit(u, x, y, r) {                   // 금속 색상: 몸통 위로 빛이 스치고 가끔 별 모양으로 반짝여요
  const sd = u.seed || 0, ph = (clock * .8 + sd) % 2.6;
  ctx.save(); ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.clip();
  if (ph < .7) { ctx.translate(x, y); ctx.rotate(-.6); const px = -r * 1.6 + (ph / .7) * r * 3.2; ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.fillRect(px - r * .18, -r * 1.6, r * .36, r * 3.2); }
  ctx.restore();
  const sp = (clock * .9 + sd * 1.7) % 3;
  if (sp < .4) {
    const k = 1 - Math.abs(sp - .2) / .2, s = r * .5 * k, sx = x - r * .35, sy = y - r * .55;
    ctx.fillStyle = '#fff'; ctx.beginPath();
    ctx.moveTo(sx, sy - s); ctx.lineTo(sx + s * .25, sy - s * .25); ctx.lineTo(sx + s, sy); ctx.lineTo(sx + s * .25, sy + s * .25);
    ctx.lineTo(sx, sy + s); ctx.lineTo(sx - s * .25, sy + s * .25); ctx.lineTo(sx - s, sy); ctx.lineTo(sx - s * .25, sy - s * .25); ctx.closePath(); ctx.fill();
  }
}

/* ---- 로딩 화면: 여러 색 페인트가 화면을 가득 채우고 흘러내림 ---- */
const TIPS = [
  '타이탄과 아르마딜로는 맨 앞에 두는 게 좋아요.', '런치킨은 후방에 두면 오래 살아서 더 많이 칠해요.', '남은 코인은 전투가 시작되면 사라져요. 준비 시간에 다 쓰세요!',
  '페인트런처는 모든 원거리 캐릭터의 천적이에요.', '캐슬은 중앙에 두면 가장 효율이 좋아요.', '전투 중에 소환한 캐릭터는 잠깐 무적이에요.',
  '점유율은 전투가 끝났을 때만 계산돼요. 후반에 칠하는 게 중요해요!', '같은 곳을 다시 칠하면 나중에 칠한 색이 남아요.', '소방관은 뭉쳐서 오는 기사에게 강해요.',
  '마법사는 타이탄의 천적이에요.', '꽃순이는 튼튼한 탱커 뒤에 있으면 훨씬 강해요.', '아르마딜로는 혼자보다 여럿이 뭉칠 때 강해요.',
  '궁수가 서넛 모이면 웬만한 상대에게 지지 않아요.', '마녀의 저주 장판 안에서는 적이 느려지고 둔해져요.', '팔레트에서 같은 캐릭터가 또 나오면 증강권이 돼요.',
  '미션은 칸마다 하루에 한 번 바꿀 수 있어요.', '통솔력이 오르면 AI 지휘관도 점점 똑똑해져요.', '후반에는 즉각 승부를 내는 카드가 유리해요.',
  '암살자는 적의 원거리 유닛을 노려요.', '전투 중 코인은 후반으로 갈수록 빨리 모여요.', '백업 코드는 ⚙️ 설정에서 만들 수 있어요.', '전투 전에는 상대 지휘관이 누군지 알 수 없어요. 방심하지 마세요!'
];
const LD = { on: false, t: 0, dur: 1.2, blobs: [], cb: null, hold: 0, done: false };
const LD_COLS = ['#ff3d6e', '#2f6bff', '#ffd84d', '#34d399', '#a855f7', '#ff8a1f', '#14b8a6', '#f472b6'];
function loadScreen(cb, dur) {                     // cb는 화면이 페인트로 완전히 덮였을 때 실행돼요
  LD.on = true; LD.t = 0; LD.hold = 0; LD.done = false; LD.dur = dur || 1.2; LD.blobs = []; LD.cb = cb || null;
  $('ldTip').textContent = '💡 ' + TIPS[Math.floor(Math.random() * TIPS.length)];
  const l = $('loading'); l.style.opacity = 1; l.hidden = false;
}
function drawLoading(dt) {
  const cvs = $('ldCv'), g = cvs.getContext('2d'), Wc = cvs.width, Hc = cvs.height;
  LD.t += dt;
  const k = Math.min(1, LD.t / LD.dur), p = k * k * (3 - 2 * k), want = Math.floor(p * 80);
  while (LD.blobs.length < want) {
    LD.blobs.push({ x: Math.random() * Wc, y: Math.random() * Hc, r: 0, max: 50 + Math.random() * 70, c: LD_COLS[Math.floor(Math.random() * LD_COLS.length)],
                    ph: Math.random() * 6, len: 0, dmax: 30 + Math.random() * 200, w: 5 + Math.random() * 8, sp: 40 + Math.random() * 70 });
  }
  g.fillStyle = '#fbfbf8'; g.fillRect(0, 0, Wc, Hc);
  for (const b of LD.blobs) {
    b.r += (b.max - b.r) * Math.min(1, dt * 7); b.len = Math.min(b.dmax, b.len + b.sp * dt);
    g.fillStyle = b.c; g.beginPath();
    for (let i = 0; i <= 20; i++) { const a = i / 20 * TAU, rr = b.r * (1 + .08 * Math.sin(a * 4 + b.ph + clock * 2)), px = b.x + Math.cos(a) * rr, py = b.y + Math.sin(a) * rr; if (i) g.lineTo(px, py); else g.moveTo(px, py); }
    g.closePath(); g.fill();
    g.fillRect(b.x - b.w / 2, b.y, b.w, b.len);                       // 흘러내리는 페인트
    g.beginPath(); g.arc(b.x, b.y + b.len, b.w / 2 + 1, 0, TAU); g.fill();
  }
  const pc = Math.floor(p * 100) + '%';
  $('ldFill').style.width = pc; $('ldPct').textContent = pc;
  if (k >= 1) {
    LD.hold += dt;
    if (LD.hold > .2 && !LD.done) {
      LD.done = true;
      if (LD.cb) { const f = LD.cb; LD.cb = null; f(); }
      $('loading').style.opacity = 0;
      setTimeout(() => { $('loading').hidden = true; LD.on = false; }, 380);
    }
  }
}

/* ---- 결과 화면 1: 두 탱크에 페인트가 차오르며 점유율을 보여줘요 ---- */
const R1 = { on: false, t: 0, pa: 0, pb: 0, win: 0, end: 4.2, parts: [], burst: false };
function startRes1(a, b) {
  const tot = S.owner.length || 1;
  Object.assign(R1, { on: true, t: 0, pa: a / tot * 100, pb: b / tot * 100, win: a > b ? 1 : a < b ? -1 : 0, parts: [], burst: false });
  $('res1').hidden = false;
}
function finishRes1() { R1.on = false; $('res1').hidden = true; $('over').hidden = false; }
$('res1').onclick = () => { if (!R1.on) return; if (R1.t < R1.end) R1.t = R1.end; else finishRes1(); };   // 터치하면 건너뛰기
function rrect(g, x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y); g.lineTo(x + w - r, y); g.quadraticCurveTo(x + w, y, x + w, y + r); g.lineTo(x + w, y + h - r);
  g.quadraticCurveTo(x + w, y + h, x + w - r, y + h); g.lineTo(x + r, y + h); g.quadraticCurveTo(x, y + h, x, y + h - r); g.lineTo(x, y + r); g.quadraticCurveTo(x, y, x + r, y); g.closePath();
}
function drawRes1(dt) {
  const cvs = $('r1cv'), g = cvs.getContext('2d'), Wc = cvs.width, Hc = cvs.height;
  R1.t += dt;
  if (R1.t > R1.end + 1.2) { finishRes1(); return; }
  const t = R1.t, m = Math.min(R1.pa, R1.pb), hi = Math.max(R1.pa, R1.pb), scale = Math.max(50, Math.ceil((hi + 5) / 10) * 10);
  const ease = x => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 2.2);
  const t1 = 1.8, t2 = 2.3, t3 = 3.0;
  const base = t < t1 ? m * ease(t / t1) : m, f2 = t < t2 ? 0 : ease((t - t2) / (t3 - t2));      // 둘 다 낮은 쪽까지 → 잠깐 멈춤 → 이긴 쪽만 마저 차오름
  const va = base + (R1.pa - m) * f2, vb = base + (R1.pb - m) * f2;
  g.fillStyle = '#fbfbf8'; g.fillRect(0, 0, Wc, Hc);
  const TX = [45, 195], TW = 120, TT = 170, TB = 650, TH = TB - TT, cols = [HEX[1], HEX[2]], vals = [va, vb], names = [NICK, (S.event ? '⚡ ' : '') + FOE_NAME];
  g.textAlign = 'center'; g.lineJoin = 'round';
  for (let i = 0; i < 2; i++) {
    const x = TX[i], h = vals[i] / scale * TH, top = TB - h;
    g.save(); rrect(g, x, TT, TW, TH, 18); g.clip();                    // 유리 탱크 안의 페인트
    g.fillStyle = 'rgba(27,31,59,.06)'; g.fillRect(x, TT, TW, TH);
    g.fillStyle = cols[i]; g.beginPath(); g.moveTo(x, TB);
    for (let px = 0; px <= TW; px += 6) g.lineTo(x + px, top + Math.sin(px * .08 + clock * 4 + i * 2) * 4);
    g.lineTo(x + TW, TB); g.closePath(); g.fill();
    g.fillStyle = 'rgba(255,255,255,.35)'; g.fillRect(x + 12, TT + 14, 8, TH - 28);
    g.restore();
    g.strokeStyle = '#1b1f3b'; g.lineWidth = 5; rrect(g, x, TT, TW, TH, 18); g.stroke();
    g.font = '34px "Jua", sans-serif'; g.lineWidth = 6; g.strokeStyle = '#fbfbf8'; g.fillStyle = '#1b1f3b';
    g.strokeText(vals[i].toFixed(1) + '%', x + TW / 2, TT - 14); g.fillText(vals[i].toFixed(1) + '%', x + TW / 2, TT - 14);
    g.font = '16px "Jua", sans-serif'; g.fillStyle = cols[i]; g.lineWidth = 4; g.strokeStyle = '#1b1f3b';
    g.strokeText(names[i], x + TW / 2, TB + 30, TW); g.fillText(names[i], x + TW / 2, TB + 30, TW);
  }
  if (t >= t3 && !R1.burst) {                      // 이긴 쪽이 다 차오르는 순간: 페인트가 사방으로 튀어요
    R1.burst = true;
    const wi = R1.win >= 0 ? 0 : 1, wx = TX[wi] + TW / 2, wy = TB - (hi / scale) * TH, cc = R1.win === 0 ? ['#ffd84d', cols[0], cols[1]] : [cols[wi], '#ffd84d', '#ffffff'];
    for (let n = 0; n < (R1.win === 0 ? 30 : 70); n++) { const a = -Math.PI / 2 + (Math.random() - .5) * 2.4, sp = 140 + Math.random() * 300; R1.parts.push({ x: wx, y: wy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: 3 + Math.random() * 6, c: cc[n % cc.length], life: 1.2 + Math.random() * .6 }); }
  }
  if (R1.win > 0 && t > t3 && t < t3 + 1.2) for (let n = 0; n < 2; n++) R1.parts.push({ x: Math.random() * Wc, y: -10, vx: (Math.random() - .5) * 60, vy: 80 + Math.random() * 120, r: 3 + Math.random() * 4, c: LD_COLS[Math.floor(Math.random() * LD_COLS.length)], life: 2 });
  for (const q of R1.parts) { q.vy += 520 * dt; q.x += q.vx * dt; q.y += q.vy * dt; q.life -= dt; if (q.life > 0) { g.globalAlpha = Math.min(1, q.life); g.fillStyle = q.c; g.beginPath(); g.arc(q.x, q.y, q.r, 0, TAU); g.fill(); } }
  R1.parts = R1.parts.filter(q => q.life > 0); g.globalAlpha = 1;
  if (t < t3) { g.font = '44px "Jua", sans-serif'; g.lineWidth = 8; g.strokeStyle = '#fbfbf8'; g.fillStyle = '#1b1f3b'; g.strokeText('점유율', Wc / 2, 90); g.fillText('점유율', Wc / 2, 90); }
  else {                                           // 승리! / 패배… / 무승부
    const k = Math.min(1, (t - t3) / .35), sc = 1 + 2.70158 * Math.pow(k - 1, 3) + 1.70158 * Math.pow(k - 1, 2);
    const txt = R1.win > 0 ? '승리!' : R1.win < 0 ? '패배…' : '무승부';
    g.save(); g.translate(Wc / 2, 92); g.scale(sc, sc);
    g.font = '72px "Jua", sans-serif'; g.lineWidth = 12; g.strokeStyle = '#1b1f3b'; g.fillStyle = R1.win > 0 ? '#ffd84d' : R1.win < 0 ? '#9aa3c7' : '#ffffff';
    g.strokeText(txt, 0, 0); g.fillText(txt, 0, 0); g.restore();
  }
  if (t > 1) { g.font = '13px "Jua", sans-serif'; g.fillStyle = 'rgba(27,31,59,.5)'; g.fillText('화면을 터치하면 넘어가요', Wc / 2, Hc - 24); }
}

function fit() {
  const s = Math.min(innerWidth / 360, innerHeight / 770);
  $('wrap').style.height = Math.max(770, innerHeight / s) + 'px';     // 화면이 세로로 더 길면 아래쪽을 늘려서 꽉 채움
  $('wrap').style.transform = `translate(-50%,-50%) scale(${s})`;
}
addEventListener('resize', fit);

function loop(ts) {
  const dt = Math.min(.05, (ts - last) / 1000 || 0); last = ts; clock = ts / 1000; if (animColor) applyColors(); bgmTick(dt);
  if (screen === 'game') { if (S.phase !== 'over') update(dt); draw(); ui(); }
  else if (screen === 'home') drawHome();
  else if (screen === 'palette') drawPal();
  if (R1.on) drawRes1(dt);
  if (LD.on) drawLoading(dt);
  requestAnimationFrame(loop);
}

fit(); newGame(); show('home'); loadScreen(null, 1.4); requestAnimationFrame(loop);
})();
</script>
