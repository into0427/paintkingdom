<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paint Kingdom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0f1226;overflow:hidden;font-family:"Jua","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif}
#wrap{position:absolute;left:50%;top:50%;width:360px;height:770px;display:flex;flex-direction:column;background:#1b1f3b;user-select:none;-webkit-user-select:none}
#hud{height:40px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;color:#fff;font-size:16px}
#timer{font-size:20px;color:#ffd84d}
#cv{width:360px;height:480px;display:block;background:#fbfbf8;touch-action:none}
#panel{flex:1;min-height:250px;padding:8px;display:flex;flex-direction:column;gap:6px}
#units{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;flex:1}
.ub{flex:1;border:0;border-radius:12px;background:#fbfbf8;color:#1b1f3b;font:inherit;font-size:13px;display:flex;flex-direction:row;align-items:center;justify-content:center;gap:7px;cursor:pointer}
.ub .ic{font-size:24px;line-height:1}
.tx{display:flex;flex-direction:column;align-items:flex-start;line-height:1.2}
.ub small{font:inherit;font-size:11px;color:#6b6f8d}
.ub:active:not(:disabled){transform:scale(.96)}
.ub:disabled{opacity:.35;cursor:default}
#go{height:34px;border:0;border-radius:10px;background:#ffd84d;color:#1b1f3b;font:inherit;font-size:15px;cursor:pointer}
#go:disabled{background:#3a3f66;color:#c9cbe0;cursor:default}
#over{position:absolute;inset:0;background:rgba(15,18,38,.82);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#fff;text-align:center}
#over[hidden]{display:none}
#over h1{margin:0;font-size:44px;font-weight:400}
#over p{margin:0;font-size:18px;line-height:1.5}
#again,#tohome{margin-top:0;border:0;border-radius:12px;background:#ffd84d;color:#1b1f3b;font:inherit;font-size:18px;padding:10px 28px;cursor:pointer}
.scr{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column}
.scr[hidden]{display:none}
#hcv{position:absolute;left:0;top:0;width:100%;height:100%}
.hui{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;align-items:center;padding-top:5%}
#logo{text-align:center;transform:rotate(-4deg);line-height:.95}
#logo .crown{font-size:46px;display:block;animation:bob 2s ease-in-out infinite}
#logo b{display:block;font-weight:400;font-size:62px;-webkit-text-stroke:5px #1b1f3b;paint-order:stroke fill;text-shadow:0 5px 0 #1b1f3b}
#logo .l1{color:var(--c1,#2f6bff)}
#logo .l2{color:var(--c2,#ff3d6e)}
@keyframes bob{50%{transform:translateY(-6px) rotate(6deg)}}
.sub{margin-top:12px;color:#1b1f3b;font-size:15px;text-align:center}
.hbtns{margin-top:16px;display:flex;flex-direction:column;gap:12px;width:260px}
.big,.mid{font:inherit;cursor:pointer;color:#1b1f3b;border:3px solid #1b1f3b;border-radius:16px;box-shadow:0 5px 0 #1b1f3b}
.big{background:#ffd84d;font-size:24px;padding:12px}
.mid{background:#fbfbf8;font-size:17px;padding:9px}
.big:active:not(:disabled),.mid:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 #1b1f3b}
.big:disabled,.mid:disabled{opacity:.4;cursor:default}
.panel2{background:#1b1f3b;color:#fff;padding:14px;gap:10px}
.panel2 h2{margin:0;font-weight:400;font-size:24px;text-align:center}
.shead{display:flex;justify-content:space-between;font-size:14px;color:#c9cbe0}
#sgrid{flex:1;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;gap:8px;align-content:start;padding:2px}
.card{border:3px solid transparent;border-radius:12px;background:#2b3060;color:#fff;font:inherit;text-align:left;padding:8px;display:flex;gap:8px;align-items:flex-start;cursor:pointer;opacity:.55}
.card.on{border-color:#ffd84d;background:#3a4180;opacity:1}
.ci{font-size:28px;line-height:1}
.ct{display:flex;flex-direction:column;gap:2px;font-size:13px}
.ct small{color:#ffd84d;font-size:12px}
.ct em{font-style:normal;color:#c9cbe0;font-size:11px}
.ct i{font-style:normal;color:#e5e7f5;font-size:11px;line-height:1.3}
#tbody{flex:1;overflow-y:auto;font-size:15px;line-height:1.6;background:#2b3060;border-radius:12px;padding:12px}
#tbody p{margin:0 0 8px}
#tbody ul{padding-left:18px;margin:0}
#tbody li{margin-bottom:5px;font-size:14px}
#tdots{display:flex;justify-content:center;gap:6px}
#tdots span{width:8px;height:8px;border-radius:50%;background:#4a5090}
#tdots span.on{background:#ffd84d}
.tnav{display:flex;gap:10px}
.tnav .mid{flex:1}
.obtn{display:flex;gap:10px;margin-top:8px}
#tohome{background:#fbfbf8}
.who{margin-top:8px;background:#fbfbf8;border:3px solid #1b1f3b;border-radius:20px;padding:3px 14px;font-size:15px;cursor:pointer;color:#1b1f3b}
#nick{font:inherit;font-size:18px;padding:10px 12px;border-radius:12px;border:3px solid #4a5090;background:#2b3060;color:#fff;outline:none}
#nick:focus{border-color:#ffd84d}
.plabel{font-size:14px;color:#c9cbe0}
#phint{min-height:18px;font-size:13px;color:#ffd84d;text-align:center}
#cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sw{border:3px solid transparent;border-radius:12px;background:#2b3060;color:#fff;font:inherit;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.sw.on{border-color:#ffd84d;background:#3a4180}
.sw b{font-weight:400;font-size:13px}
.sw small{font-size:11px;color:#c9cbe0}
.sw.t1 small{color:#7dd3fc}
.sw.t2 small{color:#ffd84d}
.sw .dot{width:38px;height:38px;border-radius:50%;border:3px solid #fff;display:flex;align-items:center;justify-content:center;font-size:16px}
.sw.lock{opacity:.5}
.sw.lock .dot{filter:grayscale(.7)}
#cprev{display:flex;align-items:center;justify-content:center;gap:12px;font-size:16px}
#cprev span{width:34px;height:34px;border-radius:50%;border:3px solid #fff}
#pm{background:var(--c1,#2f6bff)}
#pf{background:var(--c2,#ff3d6e)}
#stats{margin-top:8px;display:flex;gap:8px}
.pill{background:#1b1f3b;color:#fff;border-radius:16px;padding:3px 12px;font-size:14px}
#lbar{margin-top:8px;width:230px;height:10px;border-radius:6px;background:rgba(27,31,59,.15);overflow:hidden;border:2px solid #1b1f3b}
#lfill{display:block;height:100%;background:#ffd84d;width:0}
.tiny{margin-top:4px;font-size:12px;color:#1b1f3b}
.glow{animation:glow 1.4s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 5px 0 #1b1f3b,0 0 16px 4px #ffd84d}}
.card.lock{opacity:.35}
.card.lock .ci{filter:grayscale(1)}
.tk{color:#7dd3fc;font-size:11px}
#pinfo{font-size:17px;line-height:1.6;color:#ffd84d;padding:0 16px;text-align:center}
#palbox{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#2b3060;border-radius:16px;text-align:center;padding:14px}
#palicon{font-size:96px;line-height:1}
@keyframes shake{0%,100%{transform:rotate(0)}15%{transform:rotate(-14deg) scale(1.1)}35%{transform:rotate(12deg) scale(1.15)}55%{transform:rotate(-10deg) scale(1.2)}75%{transform:rotate(8deg) scale(1.1)}}
.shake{animation:shake .7s}
#palres .ri{font-size:56px;line-height:1.2}
#palres b{font-size:22px;font-weight:400}
#palres small{display:block;color:#c9cbe0;font-size:14px;margin-top:4px}
#palres b.new{color:#ffd84d}
#palres b.dup{color:#7dd3fc}
#palres b.jack{color:#ff9ff3}
.card{position:relative}
.gear{position:absolute;top:5px;right:7px;font-size:16px}
.up{display:block;margin-top:2px;color:#ffd84d;font-size:11px;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.35}}
#pcv{width:100%;max-width:340px;height:auto}
#auglist{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.arow{display:flex;align-items:center;gap:10px;background:#2b3060;border-radius:12px;padding:10px;border:3px solid transparent}
.arow.done{border-color:#34d399;background:#24504a}
.arow .an{flex:1;display:flex;flex-direction:column;gap:2px}
.arow .an b{font-weight:400;font-size:15px}
.arow .an span{color:#c9cbe0;font-size:12px;line-height:1.35}
.abuy{border:0;border-radius:10px;background:#ffd84d;color:#1b1f3b;font:inherit;font-size:14px;padding:8px 10px;min-width:74px;cursor:pointer}
.abuy.dim{background:#4a5090;color:#c9cbe0}
.abuy:disabled{background:#34d399;color:#0b3d2e;cursor:default}
#aughint{min-height:18px;font-size:13px;color:#ffd84d;text-align:center}
.hrow{display:flex;gap:10px}
.hrow .mid{flex:1;padding:9px 2px;font-size:16px}
#mlist{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.mrow{display:flex;align-items:center;gap:10px;background:#2b3060;border-radius:12px;padding:12px}
.mt{flex:1;display:flex;flex-direction:column;gap:4px}
.mt b{font-weight:400;font-size:15px;line-height:1.35}
.mt span{color:#ffd84d;font-size:12px}
.mre{border:0;border-radius:10px;background:#4a5090;color:#fff;font:inherit;font-size:12px;padding:8px;min-width:68px;cursor:pointer}
.mre:disabled{opacity:.45;cursor:default}
.hm{border:0;background:transparent;color:#fff;font-size:18px;cursor:pointer;padding:0 4px}
#bSet{position:absolute;top:12px;right:12px;z-index:3;width:42px;height:42px;border-radius:50%;border:3px solid #1b1f3b;background:#fbfbf8;font-size:20px;cursor:pointer;box-shadow:0 3px 0 #1b1f3b}
.sl{display:flex;align-items:center;gap:10px;font-size:14px}
.sl input{flex:1}
#bk{background:#2b3060;color:#fff;border:3px solid #4a5090;border-radius:12px;padding:8px;font-size:11px;font-family:monospace;resize:none}
#bkHint{min-height:18px;font-size:13px;color:#ffd84d;text-align:center}
#sNote{font-size:12px}
.ic canvas,.ci canvas{display:block}
#augtitle canvas{vertical-align:middle}
.mre{white-space:normal;line-height:1.2}
#res1{z-index:20;background:#fbfbf8;cursor:pointer}
#loading{z-index:30;background:#fbfbf8;transition:opacity .35s}
#r1cv,#ldCv{position:absolute;left:0;top:0;width:100%;height:100%}
.lbot{position:absolute;left:0;right:0;bottom:46px;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 22px}
#ldTip{color:#1b1f3b;font-size:14px;text-align:center;line-height:1.4;background:rgba(251,251,248,.92);padding:8px 12px;border-radius:12px;border:2px solid #1b1f3b}
#ldBarW{width:250px;height:16px;border:3px solid #1b1f3b;border-radius:10px;background:#fbfbf8;overflow:hidden}
#ldFill{display:block;height:100%;width:0;background:#ffd84d}
#ldPct{font-size:22px;color:#1b1f3b;text-shadow:0 0 6px #fbfbf8,0 0 6px #fbfbf8,0 0 6px #fbfbf8}
</style>
</head>
<body>
<div id="wrap">
  <div id="hud"><button class="hm" id="hMute">🔊</button><span id="phase"></span><span id="timer"></span><span id="coin"></span></div>
  <canvas id="cv" width="360" height="480"></canvas>
  <div id="panel">
    <div id="units"></div>
    <button id="go"></button>
  </div>
  <div id="over" hidden>
    <h1 id="title"></h1>
    <p id="result"></p>
    <div id="pinfo"></div>
    <button class="mid" id="opal" hidden></button>
    <div class="obtn"><button id="again">🔁 다시 하기</button><button id="tohome">🏠 홈 화면</button></div>
  </div>

  <div id="res1" class="scr" hidden><canvas id="r1cv" width="360" height="770"></canvas></div>
  <div id="loading" class="scr" hidden>
    <canvas id="ldCv" width="360" height="770"></canvas>
    <div class="lbot"><div id="ldTip"></div><div id="ldBarW"><i id="ldFill"></i></div><div id="ldPct">0%</div></div>
  </div>

  <div id="home" class="scr">
    <canvas id="hcv" width="360" height="770"></canvas>
    <button id="bSet">⚙️</button>
    <div class="hui">
      <div id="logo"><span class="crown">👑</span><b class="l1">Paint</b><b class="l2">Kingdom</b></div>
      <div class="sub">페인트볼 군대로 아레나를 물들여라!</div>
      <div class="who" id="who"></div>
      <div id="stats"><div class="pill" id="sPow"></div><div class="pill" id="sGem"></div></div>
      <div id="lbar"><i id="lfill"></i></div>
      <div class="tiny" id="lmsg"></div>
      <div class="hbtns">
        <button class="big" id="bStart">▶ 게임 시작</button>
        <button class="mid" id="bSel">🛡️ 캐릭터 선택</button>
        <div class="hrow"><button class="mid" id="bPal">🎨 팔레트 <span id="palN"></span></button><button class="mid" id="bMis">📜 미션</button></div>
        <div class="hrow"><button class="mid" id="bProf">👤 프로필</button><button class="mid" id="bTut">📖 튜토리얼</button></div>
      </div>
    </div>
  </div>

  <div id="select" class="scr panel2" hidden>
    <h2>🎨 캐릭터 선택</h2>
    <div class="shead"><span id="scount"></span><span id="shint">출전시킬 캐릭터를 눌러서 고르세요</span></div>
    <div id="sgrid"></div>
    <button class="big" id="sdone">완료</button>
  </div>

  <div id="palette" class="scr panel2" hidden>
    <h2>🎨 팔레트</h2>
    <div class="plabel" id="palcnt"></div>
    <div id="palbox"><canvas id="pcv" width="340" height="270"></canvas><div id="palres"></div></div>
    <button class="big" id="palopen">열기!</button>
    <button class="mid" id="palback">돌아가기</button>
  </div>

  <div id="augscr" class="scr panel2" hidden>
    <h2 id="augtitle"></h2>
    <div class="plabel" id="augsub"></div>
    <div id="auglist"></div>
    <div id="aughint"></div>
    <button class="mid" id="augback">◀ 돌아가기</button>
  </div>

  <div id="missions" class="scr panel2" hidden>
    <h2>📜 미션</h2>
    <div class="plabel">완료하면 💎 보석을 받아요. 필요한 캐릭터는 캐릭터 선택에서 출전시켜야 해요.</div>
    <div id="mlist"></div>
    <button class="mid" id="mback">◀ 돌아가기</button>
  </div>

  <div id="settings" class="scr panel2" hidden>
    <h2>⚙️ 설정</h2>
    <div class="plabel">소리</div>
    <button class="mid" id="sMusic"></button>
    <div class="sl"><span>볼륨</span><input type="range" id="sVol" min="0" max="100"><b id="sVolN"></b></div>
    <div class="plabel" id="sNote"></div>
    <div class="plabel">저장 데이터 백업 (기기를 바꿀 때 써요)</div>
    <textarea id="bk" rows="5" placeholder="'백업 코드 만들기'를 누르면 여기에 코드가 나와요. 다른 기기에서는 코드를 여기에 붙여넣고 '불러오기'를 누르세요"></textarea>
    <div class="tnav"><button class="mid" id="bkOut">📤 백업 코드 만들기</button><button class="mid" id="bkIn">📥 불러오기</button></div>
    <div id="bkHint"></div>
    <div class="plabel" id="sVer"></div>
    <button class="big" id="sdone2">완료</button>
  </div>

  <div id="profile" class="scr panel2" hidden>
    <h2>👤 닉네임 · 색상</h2>
    <div class="plabel">닉네임 (최대 10자)</div>
    <input id="nick" maxlength="10" placeholder="닉네임을 입력하세요" autocomplete="off">
    <div class="plabel">내 색상 (상대는 자동으로 보색이 돼요)</div>
    <div id="cgrid"></div>
    <div id="cprev"><span id="pm"></span><b>VS</b><span id="pf"></span></div>
    <div id="phint"></div>
    <button class="big" id="pdone">완료</button>
  </div>

  <div id="tutorial" class="scr panel2" hidden>
    <h2 id="ttitle"></h2>
    <div id="tbody"></div>
    <div id="tdots"></div>
    <div class="tnav"><button class="mid" id="tprev">◀ 이전</button><button class="mid" id="tnext">다음 ▶</button></div>
    <button class="big" id="tclose">홈으로</button>
  </div>
</div>

<script>
(() => {
'use strict';

/* ====================================================
   설정 (CONFIG) — 여기 숫자를 바꾸면 밸런스가 바뀝니다
   ==================================================== */
const CFG = {
  PREP: 60,            // 전투 전 준비 시간(초)
  BATTLE: 60,          // 전투 시간(초)
  START_COIN: 30,      // 시작 코인
  INCOME_STEPS: [      // 전투 중 코인 지급 단계: [전투 시작 후 몇 초부터, 몇 초마다 1코인]
    [0, 3],            //  0~20초: 3초마다 1코인
    [20, 2],           // 20~40초: 2초마다 1코인
    [40, 1]            // 40~60초: 1초마다 1코인
  ],
  CURSE_MOVE: 0.4,     // 저주 장판 안 이동속도 배율 (60% 감소)
  CURSE_ATK: 0.4,      // 저주 장판 안 공격속도 배율 (60% 감소)
  SPAWN_SHIELD: 4,     // 전투 중 소환한 캐릭터의 무적 시간(초) (타겟에서도 제외됨)
  SPEED_SCALE: 3,      // 이동속도 배율 (1로 하면 적어둔 숫자 그대로, 더 느려요)
  UNITS: {
    knight:   { name: '기사',       icon: '🛡️', cost: 1, hp: 100, atk: 50,  spd: 10, rate: 1,   range: 0,   r: 11, trail: 6, ai: 'melee' },
    archer:   { name: '궁수',       icon: '🏹', cost: 2, hp: 80,  atk: 70,  spd: 8,  rate: 1.2, range: 100, r: 11, arrow: 5, ai: 'ranged' },
    launcher: { name: '페인트런처', icon: '🪨', cost: 4, hp: 200, atk: 100, spd: 0,  rate: 3,   range: 250, r: 14, boom: 15, ai: 'artillery' },
    // 런치킨: 공격 없이 랜덤하게 뛰어다니며 칠함
    chicken:  { name: '런치킨',     icon: '🐔', cost: 3, hp: 70,  atk: 0,   spd: 15, rate: 0,   range: 0,   r: 9,  trail: 7, ai: 'wander' },
    // 타이탄: 거대한 탱커 (trail = 지나간 길에 칠하는 굵기)
    titan:    { name: '타이탄',     icon: '🪓', cost: 4, hp: 500, atk: 200, spd: 7,  rate: 2.2, range: 0,   r: 20, trail: 6, ai: 'melee' },
    // 소방관: atk = 초당 피해, cone = 부채꼴 각도(도), turn = 방향 전환 시간(초), dots = 초당 칠하는 점 개수, dot = 점 크기
    fire:     { name: '소방관',     icon: '🧯', cost: 3, hp: 150, atk: 40,  spd: 8,  rate: 0,   range: 90,  r: 11, cone: 40, turn: 1, dots: 100, dot: 3, ai: 'flame' },
    // 암살자: tp = 순간이동 반경, tpPaint = 도착 지점 칠하는 반경, lateTp = 전투 중 소환해도 순간이동할지(false면 전투 시작 때 있던 암살자만)
    assassin: { name: '암살자',     icon: '🥷', cost: 2, hp: 70,  atk: 80,  spd: 10, rate: 1.8, range: 0,   r: 11, tp: 200, tpPaint: 20, lateTp: true, ai: 'melee' },
    // 마녀: zone = 저주 장판 반경(칠하는 반경도 같음), zoneTime = 장판 지속시간(초)
    witch:    { name: '마녀',       icon: '🧹', cost: 3, hp: 100, atk: 50,  spd: 9,  rate: 2,   range: 90,  r: 11, zone: 25, zoneTime: 4, ai: 'witch' },
    // 마법사: zap = 번개 맞은 곳 칠하는 반경, stun = 경직 시간(초)
    mage:     { name: '마법사',     icon: '🧙', cost: 4, hp: 100, atk: 250, spd: 8,  rate: 3,   range: 120, r: 11, zap: 15, stun: 0.5, ai: 'mage' },
    // 캐슬: 건물. 반경(range) 안에 적이 있으면 rate초마다 summon 캐릭터를 자기 위치에 소환
    castle:   { name: '캐슬',       icon: '🏰', cost: 5, hp: 200, atk: 0,   spd: 0,  rate: 1.5,   range: 120, r: 18, summon: 'knight', ai: 'castle' },
    // 아르마딜로: shield = 쉴드 체력, meet = 구르기 시작 거리, rollSpd = 구르는 속도, chain = 연쇄 반경, cool = 구르기 후 쿨타임(초)
    arma:     { name: '아르마딜로', icon: '🌀', cost: 3, hp: 100, shield: 100, atk: 50, spd: 8, rate: 0, range: 0, r: 11, trail: 5, meet: 30, rollSpd: 20, chain: 75, cool: 2, ai: 'arma' },
    // 꽃순이: splash = 꽃 이펙트 반경, heal = 아군 회복 비율, dots = 걸을 때 초당 흩뿌리는 점 개수, scatter = 흩뿌리는 범위, dot = 점 크기
    flower:   { name: '꽃순이',     icon: '🌸', cost: 4, hp: 120, atk: 40,  spd: 9,  rate: 1.8, range: 70,  r: 11, splash: 35, heal: 0.2, dots: 30, scatter: 12, dot: 3, ai: 'flower' }
  }
};

/* ====================================================
   기본 준비
   ==================================================== */
const W = 360, H = 480, MID = H / 2, CELL = 4, GW = W / CELL, GH = H / CELL, TAU = Math.PI * 2;
const $ = id => document.getElementById(id);
const cv = $('cv'); let ctx = cv.getContext('2d'); const gctx = ctx;   // 홈 화면에서 ctx를 잠깐 바꿔 쓰기 위해 let
const pcv = document.createElement('canvas'); pcv.width = GW; pcv.height = GH;
const pctx = pcv.getContext('2d'), img = pctx.createImageData(GW, GH);
const COL = { 1: [47, 107, 255], 2: [255, 61, 110] };      // 1 = 플레이어(파랑), 2 = AI(분홍)
const HEX = { 1: '#2f6bff', 2: '#ff3d6e' };
let S, last = 0, clock = 0, screen = 'home';

/* ====================================================
   게임 시작 / 상태
   ==================================================== */
function newGame(real) {
  S = { phase: 'prep', t: CFG.PREP, coin: [CFG.START_COIN, CFG.START_COIN],
        units: [], shots: [], fx: [], zones: [], timers: [], stats: { summoned: {}, prepTypes: {}, battleSummons: 0, deaths: {}, kills: {}, killsTotal: 0, prepLeft: 0 }, aiPool: unlockedPool(SAVE.maxPower), aiAugs: {}, owner: new Uint8Array(GW * GH), incomeT: 0, drag: null };
  S.event = real ? rollEvent() : null;               // 특별 지휘관 등장 여부 (진짜 게임을 시작할 때만 판정)
  S.cmd = pickCommander(); S.acc = aiAcc(S.cmd); FOE_NAME = S.cmd.name; aiPrep();   // AI 지휘관이 덱을 정하고 배치
  $('over').hidden = true;
}

function startBattle() {
  if (S.phase !== 'prep') return;
  S.phase = 'battle'; S.t = CFG.BATTLE; S.drag = null;
  S.stats.prepLeft = S.coin[0]; S.coin = [0, 0]; S.incomeT = 0; titanGuard();                  // 못 쓴 코인은 사라지고, 전투는 0코인에서 시작
}

function endBattle() {
  S.phase = 'over';
  let a = 0, b = 0;
  for (const t of S.owner) { if (t === 1) a++; else if (t === 2) b++; }
  const tot = S.owner.length;
  $('title').textContent = a > b ? '🎉 승리!' : a < b ? '😢 패배' : '🤝 무승부';
  $('result').innerHTML = `${esc(NICK)} <b>${(a / tot * 100).toFixed(1)}%</b><br>${S.event ? '⚡ ' : ''}${FOE_NAME} <b>${(b / tot * 100).toFixed(1)}%</b>`;
  showOutcome(a, b);
  startRes1(a, b);                                 // 결과 화면 1(점유율 애니메이션) 다음에 결과 화면 2가 나와요
}

/* ====================================================
   캐릭터 소환
   ==================================================== */
function spawn(team, type, x, y, free, mods) {    // free = 소환 카드가 아닌 소환(캐슬/졸병), mods = 능력치 배율
  let d = CFG.UNITS[type] || EXTRA[type];
  if (mods) { d = Object.assign({}, d); d.hp = Math.round(d.hp * (mods.hp || 1)); d.atk *= mods.atk || 1; d.spd *= mods.spd || 1; }
  const u = { team, type, d, x, y, hp: d.hp, max: d.hp, cd: 0, hit: 0,
    face: team === 1 ? -Math.PI / 2 : Math.PI / 2, turn: 0, wx: x, wy: y, wt: 0, acc: 0, spray: false, born: S.phase,
    card: team === 1 && !free, nobar: !!d.nobar, elite: !!(mods && mods.elite), shield: d.shield || 0, shMax: d.shield || 0, inv: (S.phase === 'battle' && !free) ? CFG.SPAWN_SHIELD : 0, rs: 'walk', hits: [], seed: Math.random() * TAU };
  if (!free) applyAug(u, team === 1 ? undefined : (S.aiAugs || {})[type]);   // 내 소환 카드는 해금한 증강, AI는 랜덤 증강이 자동 적용
  S.units.push(u);
}

function pickSpot(team, type, yMin, yMax) {
  const r = CFG.UNITS[type].r; let x, y;
  for (let i = 0; i < 25; i++) {
    x = r + Math.random() * (W - 2 * r);
    y = Math.min(H - r, Math.max(r, yMin + Math.random() * (yMax - yMin)));
    if (!S.units.some(u => u.team === team && Math.hypot(u.x - x, u.y - y) < r + u.d.r + 4)) break;
  }
  return [x, y];
}

function buy(type) {
  const d = CFG.UNITS[type];
  if (S.phase === 'over' || S.coin[0] < d.cost) return;
  S.coin[0] -= d.cost;
  { const st = S.stats; st.summoned[type] = (st.summoned[type] || 0) + 1; if (S.phase === 'battle') st.battleSummons++; else st.prepTypes[type] = 1; }
  const [x, y] = S.phase === 'prep' ? pickSpot(1, type, MID + 24, H - 20) : pickSpot(1, type, H - 40, H - 18);
  spawn(1, type, x, y);
}

function aiBuyOne() {
  const names = Object.keys(CFG.UNITS).filter(k => CFG.UNITS[k].cost <= S.coin[1] && S.aiPool.includes(k));   // AI는 내 리그에 열린 캐릭터만
  if (!names.length) return false;
  const w = { knight: 5, archer: 3, launcher: 1.5, chicken: 1.5, titan: 1.5, fire: 2, assassin: 1, witch: 2, mage: 1.5, castle: 1, arma: 2, flower: 1.5 };
  let sum = 0; names.forEach(k => sum += (w[k] || 1.5));
  let r = Math.random() * sum, pick = names[0];
  for (const k of names) { r -= (w[k] || 1.5); if (r <= 0) { pick = k; break; } }
  S.coin[1] -= CFG.UNITS[pick].cost;
  const prep = S.phase === 'prep';
  const [x, y] = (['launcher', 'witch', 'mage', 'flower'].includes(pick) && prep) ? pickSpot(2, pick, 15, 70)
               : pickSpot(2, pick, prep ? 40 : 18, prep ? MID - 24 : 40);
  spawn(2, pick, x, y);
  return true;
}

/* ====================================================
   페인트 칠하기
   ==================================================== */
function paint(x, y, r, team) {
  const cx = x / CELL, cy = y / CELL, cr = r / CELL;
  const x0 = Math.max(0, Math.floor(cx - cr)), x1 = Math.min(GW - 1, Math.ceil(cx + cr));
  const y0 = Math.max(0, Math.floor(cy - cr)), y1 = Math.min(GH - 1, Math.ceil(cy + cr));
  for (let yy = y0; yy <= y1; yy++)
    for (let xx = x0; xx <= x1; xx++)
      if ((xx + .5 - cx) ** 2 + (yy + .5 - cy) ** 2 <= cr * cr) S.owner[yy * GW + xx] = team;
}

/* ====================================================
   전투 로직
   ==================================================== */
function near(u) {
  let b = null, bd = 1e9;
  for (const e of S.units) {
    if (e.team === u.team || e.hp <= 0) continue;
    if (e.inv > 0) continue;                       // 무적인 캐릭터는 타겟에서 제외
    const d = Math.hypot(e.x - u.x, e.y - u.y);
    if (d < bd) { bd = d; b = e; }
  }
  return [b, bd];
}

function moveTo(u, tx, ty, dt, sp) {
  const dx = tx - u.x, dy = ty - u.y, d = Math.hypot(dx, dy) || 1;
  const s = Math.min((sp || u.d.spd) * CFG.SPEED_SCALE * (u.cursed ? CFG.CURSE_MOVE : 1) * (u.spdMul || 1) * (u.slowT > 0 ? .8 : 1) * dt, d);
  u.x += dx / d * s; u.y += dy / d * s;
}

const forward = (u, dt) => moveTo(u, u.x, u.team === 1 ? 0 : H, dt);
function calcDmg(e, dmg, ranged) {                 // 받는 피해 보정 (원거리 저항, 저주 장판 증폭)
  let m = 1;
  if (ranged && e.rr) m *= e.rr;
  if (e.amp) m *= 1 + e.amp;
  return dmg * m;
}
function hurt(e, dmg, ranged, src, noRef) {        // 무적이면 무시, 쉴드가 있으면 쉴드만 깎임(남는 피해는 버려짐)
  if (e.inv > 0) return;
  dmg = calcDmg(e, dmg, ranged);
  e.hit = .12;
  if (src) e.lastHit = src;
  if (e.shield > 0) {
    if (e.shLeak) { const ab = Math.min(e.shield, dmg); e.shield -= ab; e.hp -= dmg - ab; }   // 마법 방패: 막아준 만큼만 흡수, 남는 피해는 본체로
    else e.shield -= dmg;
  } else e.hp -= dmg;
  if (e.thorn && src && !noRef && src.hp > 0) hurt(src, dmg * e.thorn, false, null, true);      // 가시: 받은 피해의 일부를 돌려줌
  if (e.type === 'chicken' && e.au && e.au.includes(4) && !(e.burstCd > 0) && e.hp > 0) { e.burstT = 3; e.burstCd = 5; }   // 놀란 가슴
}

function think(u, dt) {
  u.cd -= dt * (u.cursed ? CFG.CURSE_ATK : 1) * (u.atkMul || 1); if (u.hit > 0) u.hit -= dt; if (u.inv > 0) u.inv -= dt; if (u.slowT > 0) u.slowT -= dt;
  if (u.stun > 0) { u.stun -= dt; u.spray = false; return; }      // 경직 중에는 아무것도 못 함
  const D = u.d;
  if (D.tp && !u.tpDone) teleport(u);
  const [e, d] = near(u);
  if (D.ai === 'egg') return;                       // 알은 가만히 있는 어그로용 유닛
  if (D.ai === 'wander') return wander(u, dt);
  if (D.ai === 'flame') return flame(u, dt, e, d);
  if (D.ai === 'witch' || D.ai === 'mage') return cast(u, dt, e, d);
  if (D.ai === 'castle') return castle(u, dt, e, d);
  if (D.ai === 'arma') return arma(u, dt, e, d);
  if (D.ai === 'flower') return bloom(u, dt, e, d);

  if (D.ai === 'melee') {                       // 기사: 가장 가까운 적에게 달려가 칼질, 지나간 길을 칠함
    if (e && d <= D.r + e.d.r + 3) { if (u.cd <= 0) { hurt(e, D.atk * (u.ambushReady ? 2 : 1), false, u); u.ambushReady = false; u.cd = D.rate; } }
    else if (e) moveTo(u, e.x, e.y, dt);
    else forward(u, dt);
    if (D.trail) paint(u.x, u.y, D.trail, u.team);

  } else if (u.type === 'archer') {                // 궁수: 사거리 안이면 발사, 아니면 적을 향해 전진
    if (e && d <= D.range) {
      if (u.cd <= 0) { fireArrow(u, e); u.cd = D.rate; }
    } else if (e) moveTo(u, e.x, e.y, dt);
    else forward(u, dt);

  } else if (u.cd <= 0) {                          // 페인트런처: 사거리 안에서 가장 먼 적을 노림
    let b = null, bd = -1;
    for (const x of S.units) {
      if (x.team === u.team || x.hp <= 0) continue;
      const dd = Math.hypot(x.x - u.x, x.y - u.y);
      if (dd <= D.range && dd > bd && !(x.inv > 0)) { bd = dd; b = x; }
    }
    if (b) { S.shots.push({ k: 'ball', team: u.team, sx: u.x, sy: u.y, x: u.x, y: u.y, tx: b.x, ty: b.y, t: 0, z: 0, dmg: D.atk, d: D, src: u, rocket: !!(u.au && u.au.includes(4)), chain2: !!(u.au && u.au.includes(5)) }); u.cd = D.rate; }
  }
}

function castle(u, dt, e, d) {                     // 캐슬: 적이 반경 안에 있으면 일정 주기로 기사 소환
  const D = u.d;
  if (e && d <= D.range && u.cd <= 0) { spawn(u.team, D.summon, u.x, u.y, true, castleMods(u)); u.cd = D.rate; }
}

function pickChain(u) {                            // 아르마딜로: 구르기 연쇄 대상 (아직 안 맞춘 가장 가까운 적)
  let b = null, bd = 1e9;
  for (const e of S.units) {
    if (e.team === u.team || e.hp <= 0 || e.inv > 0 || u.hits.includes(e)) continue;
    const dd = Math.hypot(e.x - u.x, e.y - u.y) - e.d.r;
    if (dd <= u.d.chain && dd < bd) { bd = dd; b = e; }
  }
  return b;
}

function arma(u, dt, e, d) {
  const D = u.d;
  if (u.rs === 'roll') {                           // 구르는 중: 맞출 적이 없어지면 멈추고 쿨타임
    u.rtm -= dt;
    if (!u.rt || u.rt.hp <= 0 || u.rt.inv > 0) u.rt = pickChain(u);
    if (!u.rt || u.rtm <= 0) { endRoll(u); return; }
    moveTo(u, u.rt.x, u.rt.y, dt, D.rollSpd);
    paint(u.x, u.y, D.trail + 1, u.team);
    if (Math.hypot(u.rt.x - u.x, u.rt.y - u.y) <= D.r + u.rt.d.r + 2) {
      hurt(u.rt, D.atk, false, u); u.hits.push(u.rt); u.rt = pickChain(u); u.rtm = 2.5;
      if (!u.rt) endRoll(u);
    }
    return;
  }
  if (e) moveTo(u, e.x, e.y, dt); else forward(u, dt);
  paint(u.x, u.y, D.trail, u.team);
  if (u.rs === 'cool') { if (u.cd <= 0) u.rs = 'walk'; return; }
  if (e && d <= D.r + e.d.r + D.meet) { u.rs = 'roll'; u.rt = e; u.hits = []; u.rtm = 2.5; }
}

function bloom(u, dt, e, d) {                      // 꽃순이: 사거리 안이면 꽃씨 던지기, 아니면 걸으면서 도트 페인트
  const D = u.d;
  if (e && d <= D.range) {
    if (u.cd <= 0) { u.cd = D.rate; S.shots.push({ k: 'seed', team: u.team, sx: u.x, sy: u.y, x: u.x, y: u.y, tx: e.x, ty: e.y, t: 0, z: 0, dmg: D.atk, d: D, src: u, slow: !!(u.au && u.au.includes(4)), twice: !!(u.au && u.au.includes(5)) }); }
    return;
  }
  if (e) moveTo(u, e.x, e.y, dt); else forward(u, dt);
  u.acc += D.dots * dt;
  while (u.acc >= 1) {
    u.acc--;
    paint(u.x + (Math.random() - .5) * 2 * D.scatter, u.y + (Math.random() - .5) * 2 * D.scatter, D.dot, u.team);
  }
}

function teleport(u) {                             // 암살자: 처음 한 번, 반경 안에서 가장 먼 적에게 순간이동
  if (u.born === 'battle' && !u.d.lateTp) { u.tpDone = true; return; }
  let b = null, bd = -1;
  for (const e of S.units) {
    if (e.team === u.team || e.hp <= 0) continue;
    const dd = Math.hypot(e.x - u.x, e.y - u.y);
    if (dd <= u.d.tp && dd > bd && !(e.inv > 0) && e.type !== 'egg') { bd = dd; b = e; }
  }
  if (!b) return;                                  // 반경 안에 적이 없으면 첫 적이 나타날 때까지 대기
  u.tpDone = true;
  S.fx.push({ x: u.x, y: u.y, t: 0, team: u.team, r: 12 });
  u.x = b.x; u.y = b.y;
  S.fx.push({ x: u.x, y: u.y, t: 0, team: u.team, r: 12 });
  paint(u.x, u.y, u.d.tpPaint, u.team);
  if (u.au && u.au.includes(4)) u.inv = 1.5;                       // 연막탄: 순간이동 직후 무적
  if (u.au && u.au.includes(5)) u.ambushReady = true;              // 기습의 달인: 첫 공격 2배
}

function cast(u, dt, e, d) {                       // 마녀/마법사: 사거리 안이면 멈춰서 시전, 아니면 적을 향해 이동
  const D = u.d;
  if (e && d <= D.range) {
    if (u.cd <= 0) {
      u.cd = D.rate;
      if (D.ai === 'witch') castOrbs(u, e);
      else strike(u, e);
    }
  } else if (e) moveTo(u, e.x, e.y, dt);
  else forward(u, dt);
}

function strike(u, e) {                            // 마법사: 번개 한 방 (단일 피해 + 짧은 경직)
  const D = u.d;
  hurt(e, D.atk, true, u);
  if (!(e.inv > 0)) e.stun = Math.max(e.stun || 0, D.stun);
  paint(e.x, e.y, D.zap, u.team);
  S.fx.push({ x: e.x, y: e.y, t: 0, team: u.team, r: D.zap, bolt: true });
  if (u.au && u.au.includes(5)) {                  // 체인 라이트닝: 가까운 다른 적 1명에게 튕김 (피해 30%)
    let b = null, bd = 1e9;
    for (const o of S.units) {
      if (o === e || o.team === u.team || o.hp <= 0 || o.inv > 0) continue;
      const dd = Math.hypot(o.x - e.x, o.y - e.y);
      if (dd <= 50 && dd < bd) { bd = dd; b = o; }
    }
    if (b) { hurt(b, D.atk * .3, true, u); paint(b.x, b.y, D.zap, u.team); S.fx.push({ x: b.x, y: b.y, t: 0, team: u.team, r: D.zap, bolt: true }); }
  }
}

function wander(u, dt) {                           // 런치킨: 아레나 아무 곳이나 정해서 뛰어다니며 칠함
  if (Math.hypot(u.wx - u.x, u.wy - u.y) < 6 || (u.wt -= dt) <= 0) {
    u.wx = 15 + Math.random() * (W - 30); u.wy = 15 + Math.random() * (H - 30); u.wt = 3;
  }
  moveTo(u, u.wx, u.wy, dt);
  paint(u.x, u.y, u.d.trail, u.team);
}

const angDiff = (a, b) => Math.abs(Math.atan2(Math.sin(a - b), Math.cos(a - b)));

function flame(u, dt, e, d) {                      // 소방관: 부채꼴 분사, 방향을 바꾸려면 잠깐 멈춤
  const D = u.d, HALF = D.cone / 2 * Math.PI / 180;
  u.spray = false;
  if (!e) { u.face = u.team === 1 ? -Math.PI / 2 : Math.PI / 2; forward(u, dt); return; }
  const ang = Math.atan2(e.y - u.y, e.x - u.x);
  if (d - e.d.r > D.range) {                       // 사거리 밖: 적을 향해 이동
    u.turn = 0; u.face = ang; moveTo(u, e.x, e.y, dt); return;
  }
  if (u.turn > 0) {                                // 방향 전환 중 (이 동안은 공격 못 함)
    u.turn -= dt; if (u.turn <= 0) u.face = ang;
    return;
  }
  if (angDiff(ang, u.face) > HALF + Math.atan2(e.d.r, d)) { u.turn = D.turn; return; }   // 적이 부채꼴 밖 → 방향 전환 시작
  u.spray = true;                                  // 분사: 부채꼴 안의 모든 적에게 초당 피해
  for (const t of S.units) {
    if (t.team === u.team || t.hp <= 0 || t.inv > 0) continue;
    const dx = t.x - u.x, dy = t.y - u.y, dd = Math.hypot(dx, dy) || 1;
    if (dd - t.d.r > D.range) continue;
    if (angDiff(Math.atan2(dy, dx), u.face) <= HALF + Math.atan2(t.d.r, dd)) { const v = calcDmg(t, D.atk * dt * (u.cursed ? CFG.CURSE_ATK : 1), true); t.lastHit = u; if (t.shield > 0) t.shield -= v; else t.hp -= v; }
  }
  u.acc += D.dots * dt * (u.cursed ? CFG.CURSE_ATK : 1);                            // 부채꼴 안에 도트로 페인트 흩뿌리기
  while (u.acc >= 1) {
    u.acc--;
    const rr = D.range * Math.sqrt(Math.random()), aa = u.face + (Math.random() - .5) * 2 * HALF;
    paint(u.x + Math.cos(aa) * rr, u.y + Math.sin(aa) * rr, D.dot, u.team);
  }
}

function separate() {                              // 캐릭터끼리 겹치지 않게 살짝 밀어내기
  const a = S.units;
  for (let i = 0; i < a.length; i++) for (let j = i + 1; j < a.length; j++) {
    const p = a[i], q = a[j]; if (p.hp <= 0 || q.hp <= 0) continue;
    let dx = q.x - p.x, dy = q.y - p.y, d = Math.hypot(dx, dy); const m = (p.d.r + q.d.r) * .9;
    if (d >= m) continue;
    if (d === 0) { dx = 1; dy = 0; d = 1; }
    const pf = p.d.spd ? 1 : 0, qf = q.d.spd ? 1 : 0, tot = pf + qf; if (!tot) continue;
    const push = m - d, nx = dx / d, ny = dy / d;
    p.x -= nx * push * pf / tot; p.y -= ny * push * pf / tot;
    q.x += nx * push * qf / tot; q.y += ny * push * qf / tot;
  }
  for (const u of a) { u.x = Math.min(W - u.d.r, Math.max(u.d.r, u.x)); u.y = Math.min(H - u.d.r, Math.max(u.d.r, u.y)); }
}

function stepShots(dt) {
  for (const s of S.shots) {
    if (s.k === 'orb') {                           // 마녀의 저주구: 맞은 상대만 피해, 떨어진 곳에 저주 장판
      if (s.tgt.hp > 0) { s.tx = s.tgt.x; s.ty = s.tgt.y; }
      const dx = s.tx - s.x, dy = s.ty - s.y, d = Math.hypot(dx, dy) || 1, st = 150 * dt;
      if (d <= st + s.tgt.d.r * .6) {
        if (s.tgt.hp > 0) hurt(s.tgt, s.dmg, true, s.src);
        const D = s.d || CFG.UNITS.witch;
        paint(s.tx, s.ty, D.zone, s.team);
        S.zones.push({ x: s.tx, y: s.ty, r: D.zone, team: s.team, t: D.zoneTime, amp: s.amp || 0 });
        S.fx.push({ x: s.tx, y: s.ty, t: 0, team: s.team, r: D.zone * .5 });
        s.dead = true;
      } else { s.x += dx / d * st; s.y += dy / d * st; }
    } else if (s.k === 'seed') {                   // 꽃순이의 꽃씨: 떨어진 곳에서 적 피해 + 아군 회복
      s.t += dt / .6;
      const t = Math.min(s.t, 1);
      s.x = s.sx + (s.tx - s.sx) * t; s.y = s.sy + (s.ty - s.sy) * t; s.z = Math.sin(Math.PI * t) * 30;
      if (s.t >= 1) {
        const D = s.d || CFG.UNITS.flower;
        bloomAt(s.tx, s.ty, s.team, D, 1, s.src, s.slow, false);
        if (s.twice) S.timers.push({ t: .6, fn: () => bloomAt(s.tx, s.ty, s.team, D, .5, s.src, s.slow, true) });
        s.dead = true;
      }
    } else if (s.k === 'parrow') {                   // 관통 화살: 방향대로 쭉 날아가며 맞는 적을 모두 공격
      const st = 220 * dt;
      s.x += s.vx * st; s.y += s.vy * st; s.left -= st;
      paint(s.x, s.y, (s.d || CFG.UNITS.archer).arrow, s.team);
      for (const e of S.units) {
        if (e.team === s.team || e.hp <= 0 || e.inv > 0 || s.hit.includes(e)) continue;
        if (Math.hypot(e.x - s.x, e.y - s.y) <= e.d.r + 3) { s.hit.push(e); hurt(e, s.dmg, true, s.src); }
      }
      if (s.left <= 0 || s.x < -20 || s.x > W + 20 || s.y < -20 || s.y > H + 20) s.dead = true;
    } else if (s.k === 'arrow') {
      if (s.tgt.hp > 0) { s.tx = s.tgt.x; s.ty = s.tgt.y; }
      const dx = s.tx - s.x, dy = s.ty - s.y, d = Math.hypot(dx, dy), st = 220 * dt;
      s.a = Math.atan2(dy, dx);
      if (d <= st + s.tgt.d.r * .6) { if (s.tgt.hp > 0) hurt(s.tgt, s.dmg, true, s.src); paint(s.tx, s.ty, (s.d || CFG.UNITS.archer).arrow, s.team); s.dead = true; }
      else { s.x += dx / d * st; s.y += dy / d * st; paint(s.x, s.y, (s.d || CFG.UNITS.archer).arrow, s.team); }
    } else {
      s.t += dt / .9;
      const t = Math.min(s.t, 1);
      s.x = s.sx + (s.tx - s.sx) * t; s.y = s.sy + (s.ty - s.sy) * t; s.z = Math.sin(Math.PI * t) * 50;
      if (s.t >= 1) {
        boomAt(s.tx, s.ty, s.team, s.d || CFG.UNITS.launcher, s.dmg, s.src, 1);
        if (s.rocket) spawn(s.team, 'minion', s.tx, s.ty, true);                       // 로켓 배송: 졸병 소환
        if (s.chain2) S.timers.push({ t: .4, fn: () => boomAt(s.tx, s.ty, s.team, s.d || CFG.UNITS.launcher, s.dmg, s.src, .5) });   // 연쇄 폭발
        s.dead = true;
      }
    }
  }
  S.shots = S.shots.filter(s => !s.dead);
  for (const f of S.fx) f.t += dt;
  S.fx = S.fx.filter(f => f.t < (f.life || .35));
}

function incomeEvery() {                           // 지금 시점의 코인 지급 간격(초) — CFG.INCOME_STEPS 참고
  const el = CFG.BATTLE - S.t;
  let v = CFG.INCOME_STEPS[0][1];
  for (const st of CFG.INCOME_STEPS) if (el >= st[0]) v = st[1];
  return v;
}

function update(dt) {
  S.t -= dt;
  if (S.phase === 'prep') { if (S.t <= 0) startBattle(); return; }

  S.incomeT += dt;
  while (S.incomeT >= incomeEvery()) {          // 5초마다 코인 +1 (플레이어, AI 모두)
    S.incomeT -= incomeEvery(); S.coin[0]++; S.coin[1]++;
    // (AI 지원군은 아래 aiBattle이 판단해요)
  }
  S.aiT = (S.aiT || 0) - dt; if (S.aiT <= 0) { S.aiT = .8; aiBattle(); }       // AI 지휘관이 0.8초마다 상황을 보고 판단
  S.zones.forEach(z => z.t -= dt);                 // 저주 장판: 시간 지나면 사라지고, 안에 있는 적은 저주 상태
  S.zones = S.zones.filter(z => z.t > 0);
  for (const u of S.units) {
    let cu = false, amp = 0;
    if (!u.slowImm) for (const z of S.zones) if (z.team !== u.team && Math.hypot(u.x - z.x, u.y - z.y) <= z.r) { cu = true; amp = Math.max(amp, z.amp || 0); }
    u.cursed = cu; u.amp = amp;
  }
  for (const u of S.units) if (u.hp > 0) { think(u, dt); if (u.au) augTick(u, dt); }
  separate();
  stepShots(dt);
  S.timers.forEach(tm => { tm.t -= dt; if (tm.t <= 0) { tm.done = true; tm.fn(); } });
  S.timers = S.timers.filter(tm => !tm.done);
  processDeaths();
  S.units = S.units.filter(u => u.hp > 0);
  if (S.t <= 0) endBattle();
}

/* ====================================================
   그리기
   ==================================================== */
function renderPaint() {
  const d = img.data, o = S.owner, sh = SHINE.on, sw0 = (clock * 38) % (GW + GH * .6 + 60) - 30, tk = Math.floor(clock * 7) * 40503;
  for (let i = 0; i < o.length; i++) {
    const t = o[i], j = i * 4;
    if (!t) { d[j + 3] = 0; continue; }
    const c = COL[t];
    if (t === 1 && sh) {                           // 금속 광택: 결을 따라 일렁이고, 빛줄기가 대각선으로 쓸고 지나가고, 가끔 반짝여요
      const u = (i % GW) + ((i / GW) | 0) * .6, wave = .94 + .06 * Math.sin(u * .35 - clock * .8);
      const k = Math.min(1, Math.max(0, 1 - Math.abs(u - sw0) / 10) * .6 + ((((i * 2654435761) ^ tk) >>> 0) % 420 === 0 ? .5 : 0));
      d[j] = Math.min(255, c[0] * wave + (255 - c[0]) * k); d[j + 1] = Math.min(255, c[1] * wave + (255 - c[1]) * k); d[j + 2] = Math.min(255, c[2] * wave + (255 - c[2]) * k);
    } else { d[j] = c[0]; d[j + 1] = c[1]; d[j + 2] = c[2]; }
    d[j + 3] = 200;
  }
  pctx.putImageData(img, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(pcv, 0, 0, W, H);
}

function drawTitan(u, c) {
  const x = u.x, y = u.y, r = u.d.r, t = clock * 3 + u.seed;
  ctx.fillStyle = c; ctx.beginPath();              // 질퍽질퍽 출렁이는 몸
  for (let i = 0; i <= 32; i++) {
    const a = i / 32 * TAU, k = r * (1 + .07 * Math.sin(a * 3 + t) + .05 * Math.sin(a * 5 - t * 1.4));
    const px = x + Math.cos(a) * k, py = y + Math.sin(a) * k;
    if (i) ctx.lineTo(px, py); else ctx.moveTo(px, py);
  }
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(x + r * .45, y + r + 2 + Math.sin(t) * 2, 3, 5, 0, 0, TAU); ctx.fill(); ctx.stroke();   // 뚝뚝 떨어지는 물감
  ctx.fillStyle = 'rgba(255,255,255,.4)'; ctx.beginPath(); ctx.ellipse(x - r * .5, y + r * .3, r * .16, r * .28, .5, 0, TAU); ctx.fill();
  ctx.fillStyle = '#111';
  [-6, 6].forEach(o => { ctx.beginPath(); ctx.arc(x + o, y + 6, 2.2, 0, TAU); ctx.fill(); });
  ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x - 9, y + 1); ctx.lineTo(x - 3, y + 4); ctx.moveTo(x + 9, y + 1); ctx.lineTo(x + 3, y + 4); ctx.stroke();
  ctx.lineCap = 'round';                           // 바이킹 뿔
  [-1, 1].forEach(s => {
    ctx.beginPath(); ctx.moveTo(x + s * r * .85, y - 8); ctx.quadraticCurveTo(x + s * r * 1.35, y - 8, x + s * r * 1.3, y - r * 1.2);
    ctx.strokeStyle = '#1b1f3b'; ctx.lineWidth = 7; ctx.stroke();
    ctx.strokeStyle = '#fef3c7'; ctx.lineWidth = 4; ctx.stroke();
  });
  ctx.strokeStyle = '#1b1f3b'; ctx.lineWidth = 2; ctx.lineCap = 'butt';   // 바이킹 투구
  ctx.fillStyle = '#9ca3af'; ctx.beginPath(); ctx.arc(x, y - 2, r * .92, Math.PI, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#6b7280'; ctx.fillRect(x - r * .92, y - 6, r * 1.84, 4); ctx.strokeRect(x - r * .92, y - 6, r * 1.84, 4);
  ctx.lineCap = 'round';                           // 커다란 칼
  ctx.strokeStyle = '#1b1f3b'; ctx.lineWidth = 8; ctx.beginPath(); ctx.moveTo(x + r * .8, y + r * .5); ctx.lineTo(x + r * 1.6, y - r * .8); ctx.stroke();
  ctx.strokeStyle = '#d1d5db'; ctx.lineWidth = 5; ctx.stroke();
  ctx.strokeStyle = '#92400e'; ctx.beginPath(); ctx.moveTo(x + r * .7, y + r * .65); ctx.lineTo(x + r * .95, y + r * .25); ctx.stroke();
}

function drawChicken(u, c) {
  const x = u.x, y = u.y, r = u.d.r, w = Math.sin(clock * 18 + u.seed) * 2;
  ctx.fillStyle = '#ef4444';                       // 벼슬
  [[-4, 1], [0, -2], [4, 1]].forEach(p => { ctx.beginPath(); ctx.arc(x + p[0], y - r + p[1], 3.5, 0, TAU); ctx.fill(); ctx.stroke(); });
  ctx.fillStyle = c;                               // 파닥이는 날개
  ctx.beginPath(); ctx.ellipse(x - r - 1, y + 2 + w, 3, 5, -.4, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(x + r + 1, y + 2 - w, 3, 5, .4, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.beginPath(); ctx.ellipse(x - r * .35, y - r * .4, r * .28, r * .18, -.6, 0, TAU); ctx.fill();
  [-3.5, 3.5].forEach(o => {                       // 깜짝 놀란 눈
    ctx.fillStyle = '#fff'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(x + o, y - 2, 3.2, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(x + o, y - 2, 1.1, 0, TAU); ctx.fill();
  });
  ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(x - 6.5, y - 6.5); ctx.lineTo(x - 1.5, y - 8); ctx.moveTo(x + 6.5, y - 6.5); ctx.lineTo(x + 1.5, y - 8); ctx.stroke();
  ctx.fillStyle = '#f59e0b'; ctx.beginPath(); ctx.moveTo(x - 3.5, y + 2); ctx.lineTo(x + 3.5, y + 2); ctx.lineTo(x, y + 8); ctx.closePath(); ctx.fill(); ctx.stroke();   // 부리
  ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.arc(x, y + 10, 2, 0, TAU); ctx.fill();
}

function drawFire(u, c) {
  const D = u.d, x = u.x, y = u.y, r = D.r, HALF = D.cone / 2 * Math.PI / 180;
  if (u.spray) {                                   // 분사 중인 부채꼴
    ctx.globalAlpha = .25; ctx.fillStyle = HEX[u.team];
    ctx.beginPath(); ctx.moveTo(x, y); ctx.arc(x, y, D.range, u.face - HALF, u.face + HALF); ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;
  }
  ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.beginPath(); ctx.ellipse(x - r * .35, y - r * .4, r * .28, r * .18, -.6, 0, TAU); ctx.fill();
  ctx.fillStyle = '#111';
  [-3.5, 3.5].forEach(o => { ctx.beginPath(); ctx.arc(x + o, y + 3, 1.7, 0, TAU); ctx.fill(); });
  ctx.save(); ctx.translate(x, y); ctx.rotate(u.face);   // 소화기 (바라보는 방향)
  ctx.fillStyle = '#dc2626'; ctx.fillRect(r - 3, -4, 9, 8); ctx.strokeRect(r - 3, -4, 9, 8);
  ctx.strokeStyle = '#374151'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(r + 6, 0); ctx.lineTo(r + 13, 0); ctx.stroke();
  ctx.restore();
  ctx.fillStyle = '#facc15'; ctx.beginPath(); ctx.arc(x, y - 1, r + 1, Math.PI, 0); ctx.closePath(); ctx.fill(); ctx.stroke();   // 소방관 모자
  ctx.fillRect(x - r - 3, y - 2, r * 2 + 6, 3); ctx.strokeRect(x - r - 3, y - 2, r * 2 + 6, 3);
  ctx.fillStyle = '#dc2626'; ctx.beginPath(); ctx.arc(x, y - r * .55, 2.6, 0, TAU); ctx.fill();
}

function drawCastle(u, c) {
  const x = u.x, y = u.y;
  ctx.fillStyle = '#9ca3af';
  ctx.fillRect(x - 16, y - 8, 32, 22); ctx.strokeRect(x - 16, y - 8, 32, 22);                       // 성벽
  [-16, -5, 6].forEach(o => { ctx.fillRect(x + o, y - 13, 10, 6); ctx.strokeRect(x + o, y - 13, 10, 6); });   // 성벽 위 총안
  ctx.fillStyle = u.hit > 0 ? '#fff' : c; ctx.fillRect(x - 16, y - 1, 32, 4);                      // 팀 색 띠
  ctx.fillStyle = '#4b5563'; ctx.fillRect(x - 5, y + 4, 10, 10); ctx.strokeRect(x - 5, y + 4, 10, 10);   // 성문
  ctx.beginPath(); ctx.moveTo(x, y - 13); ctx.lineTo(x, y - 27); ctx.stroke();                     // 깃발
  ctx.fillStyle = c; ctx.beginPath(); ctx.moveTo(x, y - 27); ctx.lineTo(x + 13, y - 23); ctx.lineTo(x, y - 19); ctx.closePath(); ctx.fill(); ctx.stroke();
}

function drawArma(u, c) {
  const x = u.x, y = u.y, r = u.d.r;
  if (u.shield > 0) { ctx.globalAlpha = .28; ctx.fillStyle = '#7dd3fc'; ctx.beginPath(); ctx.arc(x, y, r + 5, 0, TAU); ctx.fill(); ctx.globalAlpha = 1; }
  if (u.rs === 'roll') {                           // 몸을 돌돌 말고 구르는 중
    ctx.fillStyle = '#9ca3af'; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
    ctx.save(); ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.clip();
    ctx.translate(x, y); ctx.rotate(clock * 22 + u.seed); ctx.strokeStyle = '#4b5563'; ctx.lineWidth = 2;
    for (let k = -2; k <= 2; k++) { ctx.beginPath(); ctx.moveTo(k * 5, -r); ctx.lineTo(k * 5, r); ctx.stroke(); }
    ctx.restore();
    ctx.strokeStyle = c; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.stroke();
    return;
  }
  ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#9ca3af'; ctx.beginPath(); ctx.arc(x, y - 2, r, Math.PI * 1.05, Math.PI * 1.95); ctx.closePath(); ctx.fill(); ctx.stroke();   // 등껍질
  ctx.lineWidth = 1.2; [-4, 0, 4].forEach(o => { ctx.beginPath(); ctx.moveTo(x + o, y - 3); ctx.lineTo(x + o * 1.4, y - r); ctx.stroke(); });
  ctx.lineWidth = 2; ctx.fillStyle = c;
  [-1, 1].forEach(s => { ctx.beginPath(); ctx.arc(x + s * r * .7, y - r * .6, 3, 0, TAU); ctx.fill(); ctx.stroke(); });                 // 귀
  ctx.fillStyle = '#d6b3a1'; ctx.beginPath(); ctx.ellipse(x, y + 5, 4.5, 3.2, 0, 0, TAU); ctx.fill(); ctx.stroke();                       // 주둥이
  ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(x, y + 4.5, 1, 0, TAU); ctx.fill();
  [-4, 4].forEach(o => { ctx.beginPath(); ctx.arc(x + o, y + 0, 1.6, 0, TAU); ctx.fill(); });
}

function drawFlower(u, c) {

function drawAssassin(u, c) {
  const x = u.x, y = u.y, r = u.d.r;
  ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.save(); ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.clip();
  ctx.fillStyle = '#111827'; ctx.fillRect(x - r, y - 7, r * 2, 4); ctx.fillRect(x - r, y + 2, r * 2, r);   // 머리띠, 복면
  ctx.restore();
  ctx.fillStyle = '#fff';
  [-3.5, 3.5].forEach(o => { ctx.beginPath(); ctx.ellipse(x + o, y - .5, 2.4, 1.6, 0, 0, TAU); ctx.fill(); });
  ctx.fillStyle = '#111'; [-3.5, 3.5].forEach(o => { ctx.beginPath(); ctx.arc(x + o, y - .5, .9, 0, TAU); ctx.fill(); });
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.stroke();
  ctx.lineCap = 'round'; ctx.strokeStyle = '#111827'; ctx.lineWidth = 3;   // 펄럭이는 머리띠 끈
  const f = Math.sin(clock * 9 + u.seed) * 2;
  ctx.beginPath(); ctx.moveTo(x - r + 1, y - 5); ctx.lineTo(x - r - 7, y - 9 + f); ctx.moveTo(x - r + 1, y - 5); ctx.lineTo(x - r - 8, y - 3 - f); ctx.stroke();
  ctx.strokeStyle = '#d1d5db'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(x + r - 2, y + 4); ctx.lineTo(x + r + 8, y - 6); ctx.stroke();   // 쿠나이
  ctx.strokeStyle = '#111827'; ctx.beginPath(); ctx.moveTo(x + r - 3, y + 5); ctx.lineTo(x + r, y + 2); ctx.stroke();
}

function drawWitch(u, c) {
  const x = u.x, y = u.y - 3 + Math.sin(clock * 5 + u.seed) * 1.5, r = u.d.r;
  ctx.lineCap = 'round';                           // 빗자루
  ctx.strokeStyle = '#8b5a2b'; ctx.lineWidth = 3.5; ctx.beginPath(); ctx.moveTo(x - r - 4, y + r - 1); ctx.lineTo(x + r + 8, y + r - 3); ctx.stroke();
  ctx.fillStyle = '#eab308'; ctx.strokeStyle = '#1b1f3b'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(x - r - 3, y + r - 1); ctx.lineTo(x - r - 14, y + r - 6); ctx.lineTo(x - r - 14, y + r + 5); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.lineCap = 'butt'; ctx.lineWidth = 2;
  ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.beginPath(); ctx.ellipse(x - r * .35, y - r * .1, r * .25, r * .16, -.6, 0, TAU); ctx.fill();
  ctx.fillStyle = '#111'; [-3.5, 3.5].forEach(o => { ctx.beginPath(); ctx.arc(x + o, y + 3, 1.7, 0, TAU); ctx.fill(); });
  ctx.fillStyle = '#4c1d95';                       // 마녀 모자
  ctx.beginPath(); ctx.ellipse(x, y - r * .55, r + 5, 3.5, 0, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x - r * .65, y - r * .55); ctx.lineTo(x + 3, y - r - 15); ctx.lineTo(x + r * .65, y - r * .55); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#facc15'; ctx.fillRect(x - r * .5, y - r * .55 - 4, r, 3);
}

function drawMage(u, c) {
  const x = u.x, y = u.y, r = u.d.r;
  ctx.lineCap = 'round'; ctx.strokeStyle = '#92400e'; ctx.lineWidth = 3;   // 번개 지팡이
  ctx.beginPath(); ctx.moveTo(x + r + 4, y + r + 6); ctx.lineTo(x + r + 4, y - r + 1); ctx.stroke();
  ctx.fillStyle = '#fde047'; ctx.strokeStyle = '#1b1f3b'; ctx.lineWidth = 1.5; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(x + r + 8, y - r - 11); ctx.lineTo(x + r + 1, y - r - 2); ctx.lineTo(x + r + 5, y - r - 2);
  ctx.lineTo(x + r + 1, y - r + 7); ctx.lineTo(x + r + 10, y - r - 4); ctx.lineTo(x + r + 6, y - r - 4); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.lineCap = 'butt'; ctx.lineWidth = 2;
  ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.beginPath(); ctx.ellipse(x - r * .35, y - r * .4, r * .28, r * .18, -.6, 0, TAU); ctx.fill();
  ctx.fillStyle = '#111'; [-3.5, 3.5].forEach(o => { ctx.beginPath(); ctx.arc(x + o, y - 1, 1.7, 0, TAU); ctx.fill(); });
  ctx.fillStyle = '#f9fafb'; ctx.lineWidth = 1;    // 덥수룩한 눈썹
  [-3.5, 3.5].forEach(o => { ctx.beginPath(); ctx.ellipse(x + o, y - 4.5, 3.2, 1.5, 0, 0, TAU); ctx.fill(); ctx.stroke(); });
  ctx.lineWidth = 2;                               // 희고 긴 수염
  ctx.beginPath(); ctx.moveTo(x - r + 2, y + 2); ctx.quadraticCurveTo(x - 6, y + r + 4, x, y + r + 12);
  ctx.quadraticCurveTo(x + 6, y + r + 4, x + r - 2, y + 2); ctx.quadraticCurveTo(x, y + 6, x - r + 2, y + 2); ctx.closePath(); ctx.fill(); ctx.stroke();
}

function drawUnit(u) {
  const D = u.d, x = u.x, y = u.y, r = D.r, c = u.hit > 0 ? '#ffffff' : HEX[u.team];
  ctx.save();
  ctx.lineWidth = 2; ctx.strokeStyle = '#1b1f3b';
  if (u.type === 'titan') drawTitan(u, c);
  else if (u.type === 'chicken') drawChicken(u, c);
  else if (u.type === 'fire') drawFire(u, c);
  else if (u.type === 'assassin') drawAssassin(u, c);
  else if (u.type === 'witch') drawWitch(u, c);
  else if (u.type === 'mage') drawMage(u, c);
  else if (u.type === 'castle') drawCastle(u, c);
  else if (u.type === 'arma') drawArma(u, c);
  else if (u.type === 'flower') drawFlower(u, c);
  else if (u.type === 'minion') drawMinion(u, c);
  else if (u.type === 'egg') drawEgg(u, c);
  else if (u.type === 'launcher') {
    ctx.fillStyle = '#8b5a2b'; ctx.fillRect(x - r, y + 2, r * 2, 7); ctx.strokeRect(x - r, y + 2, r * 2, 7);
    ctx.fillStyle = '#4b5563';
    [-8, 8].forEach(o => { ctx.beginPath(); ctx.arc(x + o, y + 11, 4, 0, TAU); ctx.fill(); ctx.stroke(); });
    ctx.strokeStyle = '#8b5a2b'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(x - 8, y + 3); ctx.lineTo(x + 8, y - 12); ctx.stroke();
    ctx.strokeStyle = '#1b1f3b'; ctx.lineWidth = 2; ctx.fillStyle = c;
    ctx.beginPath(); ctx.arc(x + 9, y - 13, 5, 0, TAU); ctx.fill(); ctx.stroke();
  } else {
    ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.beginPath(); ctx.ellipse(x - r * .35, y - r * .4, r * .28, r * .18, -.6, 0, TAU); ctx.fill();
    ctx.fillStyle = '#111';
    [-3.5, 3.5].forEach(o => { ctx.beginPath(); ctx.arc(x + o, y + 3, 1.7, 0, TAU); ctx.fill(); });
    if (u.type === 'knight') {
      ctx.fillStyle = u.elite ? '#fbbf24' : '#9ca3af'; ctx.beginPath(); ctx.arc(x, y - 1, r + 1, Math.PI, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.strokeStyle = '#d1d5db'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x + r, y + 1); ctx.lineTo(x + r + 9, y - 9); ctx.stroke();
      ctx.strokeStyle = '#92400e'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x + r - 2, y + 4); ctx.lineTo(x + r + 1, y); ctx.stroke();
      if (u.elite) {                               // 근위 기사: 금빛 투구 + 붉은 깃털 + 금테
        ctx.fillStyle = '#dc2626'; ctx.strokeStyle = '#1b1f3b'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(x - 1, y - r - 1); ctx.quadraticCurveTo(x - 9, y - r - 12, x + 1, y - r - 16); ctx.quadraticCurveTo(x + 8, y - r - 8, x + 3, y - r - 1); ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(x, y, r + 2, .25, Math.PI - .25); ctx.stroke();
      }
    } else {
      ctx.strokeStyle = '#92400e'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(x + r - 1, y, 9, -Math.PI / 2, Math.PI / 2); ctx.stroke();
      ctx.strokeStyle = '#e5e7eb'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x + r - 1, y - 9); ctx.lineTo(x + r - 1, y + 9); ctx.stroke();
    }
  }
  if (SHINE.on && u.team === 1 && !u.nobar) shineUnit(u, x, y, r);
  if (u.inv > 0 && (u.inv > 1 || Math.sin(clock * 30) > 0)) {      // 무적 보호막 (끝나기 1초 전부터 깜빡임)
    ctx.globalAlpha = .3; ctx.fillStyle = '#7dd3fc'; ctx.beginPath(); ctx.arc(x, y, r + 6, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1; ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 2; ctx.stroke();
  }
  if (u.cursed) { ctx.strokeStyle = '#7c3aed'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, y, r + 3, 0, TAU); ctx.stroke(); }   // 저주 표시
  if (u.stun > 0) {                                // 경직 표시 (머리 위에 빙글빙글)
    ctx.fillStyle = '#facc15';
    for (let k = 0; k < 3; k++) { const a = clock * 8 + k * TAU / 3; ctx.beginPath(); ctx.arc(x + Math.cos(a) * 8, y - r - 15 + Math.sin(a) * 3, 2, 0, TAU); ctx.fill(); }
  }
  if (u.nobar) { ctx.restore(); return; }          // 홈 화면 장식용 캐릭터는 체력바 없음
  const bw = Math.max(26, r * 2), by = y - r - 9;                    // 체력바
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(x - bw / 2, by, bw, 4);
  ctx.fillStyle = '#22c55e'; ctx.fillRect(x - bw / 2, by, bw * Math.max(0, u.hp / u.max), 4);
  if (u.shield > 0) { ctx.fillStyle = '#38bdf8'; ctx.fillRect(x - bw / 2, by - 5, bw * Math.min(1, u.shield / (u.shMax || 1)), 4); }   // 쉴드바
  ctx.restore();
}

function draw() {
  ctx.fillStyle = '#fbfbf8'; ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = .06; ctx.fillStyle = HEX[2]; ctx.fillRect(0, 0, W, MID);
  ctx.fillStyle = HEX[1]; ctx.fillRect(0, MID, W, MID); ctx.globalAlpha = 1;
  renderPaint();

  for (const z of S.zones) {                       // 저주 장판
    const a = Math.min(1, z.t);
    ctx.globalAlpha = .35 * a; ctx.fillStyle = '#7c3aed';
    ctx.beginPath(); ctx.arc(z.x, z.y, z.r, 0, TAU); ctx.fill();
    ctx.globalAlpha = .8 * a; ctx.strokeStyle = '#4c1d95'; ctx.lineWidth = 2; ctx.setLineDash([5, 4]); ctx.lineDashOffset = -clock * 12;
    ctx.beginPath(); ctx.arc(z.x, z.y, z.r, 0, TAU); ctx.stroke();
    ctx.setLineDash([]); ctx.lineDashOffset = 0; ctx.globalAlpha = 1;
  }

  ctx.setLineDash([6, 6]); ctx.strokeStyle = 'rgba(27,31,59,.35)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(0, MID); ctx.lineTo(W, MID); ctx.stroke(); ctx.setLineDash([]);
  ctx.font = '14px "Jua", sans-serif'; ctx.textAlign = 'left'; ctx.lineJoin = 'round'; ctx.lineWidth = 4; ctx.strokeStyle = '#1b1f3b';   // 닉네임 표시
  ctx.fillStyle = HEX[2]; if (S.phase !== 'prep') { const fl = S.event ? '⚡ ' + FOE_NAME : FOE_NAME; ctx.strokeText(fl, 8, MID - 8); ctx.fillText(fl, 8, MID - 8); }
  ctx.fillStyle = HEX[1]; ctx.strokeText(NICK, 8, MID + 20); ctx.fillText(NICK, 8, MID + 20);

  const list = S.units.filter(u => S.phase !== 'prep' || u.team === 1).sort((a, b) => a.y - b.y);
  for (const u of list) drawUnit(u);

  for (const s of S.shots) {
    if (s.k === 'orb') {
      ctx.fillStyle = '#a855f7'; ctx.strokeStyle = '#1b1f3b'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(s.x, s.y, 6, 0, TAU); ctx.fill(); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.beginPath(); ctx.arc(s.x - 2, s.y - 2, 1.8, 0, TAU); ctx.fill();
    } else if (s.k === 'seed') {
      ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.beginPath(); ctx.ellipse(s.x, s.y, 5, 2.5, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = '#f472b6'; ctx.strokeStyle = '#1b1f3b'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(s.x, s.y - s.z, 5, 0, TAU); ctx.fill(); ctx.stroke();
    } else if (s.k === 'arrow' || s.k === 'parrow') {
      ctx.strokeStyle = '#1b1f3b'; ctx.lineWidth = 2; ctx.beginPath();
      ctx.moveTo(s.x - Math.cos(s.a) * 9, s.y - Math.sin(s.a) * 9); ctx.lineTo(s.x, s.y); ctx.stroke();
    } else {
      ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.beginPath(); ctx.ellipse(s.x, s.y, 6, 3, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = HEX[s.team]; ctx.strokeStyle = '#1b1f3b'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(s.x, s.y - s.z, 7, 0, TAU); ctx.fill(); ctx.stroke();
    }
  }
  for (const f of S.fx) {
    ctx.globalAlpha = 1 - f.t / (f.life || .35); ctx.strokeStyle = HEX[f.team]; ctx.lineWidth = 3;
    if (f.blossom) {                               // 만개: 작은 꽃 여러 송이가 한꺼번에 활짝
      const k = Math.min(1, f.t / .2);
      for (const q of f.pts) {
        const bx = f.x + q[0], by = f.y + q[1], rr = q[2] * k;
        ctx.fillStyle = '#f472b6'; ctx.lineWidth = 1;
        for (let j = 0; j < 5; j++) { const a = j * TAU / 5 + f.t * 2; ctx.beginPath(); ctx.arc(bx + Math.cos(a) * rr * .6, by + Math.sin(a) * rr * .6, rr * .45, 0, TAU); ctx.fill(); ctx.stroke(); }
        ctx.fillStyle = '#fde047'; ctx.beginPath(); ctx.arc(bx, by, rr * .35, 0, TAU); ctx.fill();
      }
    } else if (f.flower) {                                // 꽃순이의 꽃 이펙트
      ctx.fillStyle = '#f9a8d4'; ctx.lineWidth = 1.5;
      for (let k = 0; k < 6; k++) {
        const a = k * TAU / 6 + f.t * 3, q = f.r * (.4 + f.t * 2.4);
        ctx.beginPath(); ctx.arc(f.x + Math.cos(a) * q, f.y + Math.sin(a) * q, 8, 0, TAU); ctx.fill(); ctx.stroke();
      }
      ctx.fillStyle = '#fde047'; ctx.beginPath(); ctx.arc(f.x, f.y, 6, 0, TAU); ctx.fill(); ctx.stroke();
    } else { ctx.beginPath(); ctx.arc(f.x, f.y, (f.r || CFG.UNITS.launcher.boom) * (1 + f.t * 4), 0, TAU); ctx.stroke(); }
    if (f.bolt) {                                  // 마법사의 번개
      ctx.lineJoin = 'round'; ctx.beginPath(); ctx.moveTo(f.x, f.y - 140);
      for (let k = 1; k < 8; k++) ctx.lineTo(f.x + (Math.random() - .5) * 24, f.y - 140 + k * 17.5);
      ctx.lineTo(f.x, f.y);
      ctx.strokeStyle = '#fde047'; ctx.lineWidth = 5; ctx.stroke();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  if (S.phase === 'prep') {                         // 준비 중에는 상대 진영이 가려짐
    ctx.fillStyle = 'rgba(27,31,59,.88)'; ctx.fillRect(0, 0, W, MID);
    ctx.fillStyle = '#fff'; ctx.font = '18px "Jua", sans-serif'; ctx.textAlign = 'center';
    if (S.event) {                                     // 특별 지휘관은 전투 전에 안내 (이름과 덱은 비밀)
      ctx.fillStyle = '#ffd84d'; ctx.fillText('⚡ 특별 지휘관 등장!', W / 2, MID / 2 - 24);
      ctx.fillStyle = '#fff'; ctx.font = '14px "Jua", sans-serif';
      ctx.fillText(S.event.desc, W / 2, MID / 2 + 2); ctx.fillText(`이기면 팔레트 +${S.event.pal}`, W / 2, MID / 2 + 24);
    } else ctx.fillText('❓ 상대 진영 (비공개)', W / 2, MID / 2 + 6);
  }
}

function pos(e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height]; }

cv.addEventListener('pointerdown', e => {          // 준비 시간에만 아군을 드래그해서 배치
  if (S.phase !== 'prep') return;
  const [x, y] = pos(e); let best = null, bd = 1e9;
  for (const u of S.units) {
    if (u.team !== 1) continue;
    const d = Math.hypot(u.x - x, u.y - y);
    if (d < u.d.r + 8 && d < bd) { bd = d; best = u; }
  }
  if (best) { S.drag = { u: best, ox: best.x - x, oy: best.y - y }; cv.setPointerCapture(e.pointerId); }
});
cv.addEventListener('pointermove', e => {
  if (!S.drag) return;
  const [x, y] = pos(e), u = S.drag.u, r = u.d.r;
  u.x = Math.min(W - r, Math.max(r, x + S.drag.ox));
  u.y = Math.min(H - r, Math.max(MID + r, y + S.drag.oy));
});
const endDrag = () => { if (S) S.drag = null; };
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', endDrag);

let hintT;
function buildSelect() {
  const g = $('sgrid'); g.innerHTML = '';
  const pool = unlockedPool(SAVE.maxPower);

const BLOBS = [];
(function () {
  const pal = ['#2f6bff', '#ff3d6e', '#ffd84d', '#34d399', '#a855f7'], rnd = (a, b) => a + Math.random() * (b - a);

    BLOBS.push({ fx: left ? rnd(-.05, .55) : rnd(.45, 1.05), fy: rnd(0, 1), r: rnd(22, 70), ph: rnd(0, 6.28), a: rnd(.55, .9),
                 c: pal[2 + i % 3], left, mix });

function drawHome() {
  const hc = $('hcv'), Hh = $('wrap').offsetHeight || 770;
  if (hc.height !== Hh) { hc.width = 360; hc.height = Hh; }
  const hx = hc.getContext('2d');
  hx.fillStyle = '#fbfbf8'; hx.fillRect(0, 0, 360, Hh);
  for (const b of BLOBS) {
    const cx = b.fx * 360, cy = b.fy * Hh;
    hx.globalAlpha = b.a; hx.fillStyle = b.mix ? b.c : (b.left ? HEX[1] : HEX[2]); hx.beginPath();
    for (let i = 0; i <= 28; i++) {
      const a = i / 28 * TAU, k = b.r * (1 + .09 * Math.sin(a * 3 + clock * 1.2 + b.ph) + .06 * Math.sin(a * 5 - clock + b.ph));
      if (i) hx.lineTo(cx + Math.cos(a) * k, cy + Math.sin(a) * k); else hx.moveTo(cx + Math.cos(a) * k, cy + Math.sin(a) * k);
    }
    hx.closePath(); hx.fill();
    for (let j = 0; j < 3; j++) { const a = b.ph + j * 2.1; hx.beginPath(); hx.arc(cx + Math.cos(a) * b.r * 1.35, cy + Math.sin(a) * b.r * 1.35, b.r * .12, 0, TAU); hx.fill(); }
  }
  hx.globalAlpha = 1;
  const g = hx.createRadialGradient(180, 150, 10, 180, 150, 200);     // 로고 뒤에 은은한 흰 빛
  g.addColorStop(0, 'rgba(255,255,255,.88)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  hx.fillStyle = g; hx.fillRect(0, 0, 360, Hh);
  ctx = hx;
  try {
    CAST.forEach((c, i) => {
      const d = CFG.UNITS[c[1]]; if (!d) return;
      drawUnit({ team: c[0], type: c[1], d, x: c[2], y: Hh - 62 + c[3] + Math.sin(clock * 3 + i) * 3, hp: d.hp, max: d.hp,
                 shield: 0, inv: 0, hit: 0, stun: 0, rs: 'walk', spray: false, nobar: true, seed: i * 1.7, face: c[0] === 1 ? -.3 : Math.PI + .3 });
    });
  } finally { ctx = gctx; }
}

function hsl2hex(h, sat, l) {
  h = ((h % 360) + 360) % 360;
  const a = sat * Math.min(l, 1 - l), f = n => { const k = (n + h / 30) % 12; return l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)); };
  return '#' + [f(0), f(8), f(4)].map(v => Math.round(v * 255).toString(16).padStart(2, '0')).join('');
}

const ANIM = {                                     // 계속 변하는 색상들: 시간(초) -> [내 색, 상대 색]
  rainbow: t => { const h = (t * 30) % 360; return [hsl2hex(h, .85, .55), hsl2hex(h + 180, .85, .55)]; },
  aurora:  t => { const h = 225 + 55 * Math.sin(t * .5); return [hsl2hex(h, .75, .55), hsl2hex(h + 150, .7, .5)]; },
  lava:    t => { const h = 18 + 14 * Math.sin(t * .8); return [hsl2hex(h, 1, .5 + .06 * Math.sin(t * 2.2)), hsl2hex(205, .85, .45)]; },
  cyber:   t => { const h = 242 + 58 * Math.sin(t * 1.1); return [hsl2hex(h, 1, .55), hsl2hex(78, 1, .45)]; }
};

const BASE = ['knight', 'archer', 'titan', 'launcher', 'chicken'];   // 처음부터 가진 캐릭터
const LEAGUES = [                                  // min = 리그 시작 통솔력(= 바닥), unlock = 이 리그부터 팔레트에 나오는 캐릭터
  { name: '캐주얼 리그', min: 0,   unlock: [] },

  { name: '위즈 리그',   min: 200, unlock: ['witch', 'mage'] },

const POWER = { ai: 20, pvp: 40 };                 // 승패에 따른 통솔력 기준값 (실제로는 점유율 차이에 따라 ±2)

  pity: 4,                                         // 새 캐릭터를 이만큼 연속으로 못 뽑으면 다음 팔레트는 새 캐릭터 확정
  gems: [[20, .5], [40, .3], [80, .15], [150, .05]]   // [보석 개수, 확률]
};
const DEV_BOOST = null;                            // 테스트용: { id: 1, power: 250, gems: 500, palettes: 5 } 처럼 적으면 한 번만 적용돼요 (id를 바꾸면 또 적용)

let SAVE = { power: 0, maxPower: 0, gems: 0, owned: BASE.slice(), tickets: {}, augs: {}, missions: [], palettes: 0, palGiven: 0, dry: 0 };
try { Object.assign(SAVE, JSON.parse(localStorage.getItem('pk_save') || '{}')); } catch (e) {}
if (!Array.isArray(SAVE.owned)) SAVE.owned = [];
if (!SAVE.augs || typeof SAVE.augs !== 'object') SAVE.augs = {};
if (!Array.isArray(SAVE.missions)) SAVE.missions = [];
if (!SAVE.tickets || typeof SAVE.tickets !== 'object') SAVE.tickets = {};
SAVE.owned = SAVE.owned.filter(k => CFG.UNITS[k]);
BASE.forEach(k => { if (CFG.UNITS[k] && !SAVE.owned.includes(k)) SAVE.owned.push(k); });
const persist = () => store('pk_save', JSON.stringify(SAVE));
if (DEV_BOOST && SAVE.boost !== DEV_BOOST.id) {
  SAVE.power = Math.max(SAVE.power, DEV_BOOST.power || 0); SAVE.maxPower = Math.max(SAVE.maxPower, SAVE.power);
  SAVE.gems += DEV_BOOST.gems || 0; SAVE.palettes += DEV_BOOST.palettes || 0;
  if (DEV_BOOST.all) { Object.keys(CFG.UNITS).forEach(k => { if (!SAVE.owned.includes(k)) SAVE.owned.push(k); }); SEL = SAVE.owned.slice(0, MAX_PICK); saveSel(); }
  if (DEV_BOOST.tickets) SAVE.owned.forEach(k => { SAVE.tickets[k] = (SAVE.tickets[k] || 0) + DEV_BOOST.tickets; });
  SAVE.palGiven = Math.floor(SAVE.maxPower / PALETTE_STEP); SAVE.boost = DEV_BOOST.id; persist();
}
SEL = SEL.filter(k => SAVE.owned.includes(k));
if (!SEL.length) SEL = SAVE.owned.slice(0, MAX_PICK);

function leagueIdx(p) { let i = 0; LEAGUES.forEach((l, n) => { if (p >= l.min) i = n; }); return i; }
const leagueOf = k => { const l = LEAGUES.find(x => x.unlock.includes(k)); return l ? l.name : '더 높은 리그'; };
function unlockedPool(p) {                         // 이 통솔력에서 팔레트(와 AI)에 나올 수 있는 캐릭터
  const pool = BASE.filter(k => CFG.UNITS[k]);
  LEAGUES.forEach(l => { if (p >= l.min) l.unlock.forEach(k => { if (CFG.UNITS[k] && !pool.includes(k)) pool.push(k); }); });
  return pool;
}

function applyResult(a, b) {                       // 전투 결과를 통솔력에 반영
  const tot = a + b, d = tot ? Math.abs(a - b) / tot : 0;
  const delta = Math.round(POWER.ai - 2 + 4 * Math.min(1, d / .5));     // 점유율 차이에 따라 18~22
  const before = SAVE.power, lg0 = leagueIdx(SAVE.maxPower);
  const ch = a > b ? delta : a < b ? -delta : 0;
  SAVE.power = Math.max(LEAGUES[lg0].min, SAVE.power + ch);              // 리그 바닥 아래로는 안 떨어짐
  SAVE.maxPower = Math.max(SAVE.maxPower, SAVE.power);
  const earned = Math.max(0, Math.floor(SAVE.maxPower / PALETTE_STEP) - SAVE.palGiven);
  SAVE.palGiven += earned; SAVE.palettes += earned;
  persist();
  const lg1 = leagueIdx(SAVE.maxPower);
  return { ch, real: SAVE.power - before, earned, promoted: lg1 > lg0 ? lg1 : -1 };
}

function showOutcome(a, b) {                       // 종료 화면에 통솔력/팔레트 결과 표시
  const r = applyResult(a, b), lg = LEAGUES[leagueIdx(SAVE.maxPower)];
  const lab = a > b ? '+' + r.ch : a < b ? (r.real === 0 ? '리그 바닥이라 유지' : r.real) : '무승부';
  let h = `👑 통솔력 <b>${SAVE.power}</b> (${lab}) · ${lg.name}`;
  if (r.promoted >= 0) {
    const names = LEAGUES[r.promoted].unlock.map(k => CFG.UNITS[k] && CFG.UNITS[k].name).filter(Boolean).join('·');
    h += `<br>🎉 ${LEAGUES[r.promoted].name} 승급!` + (names ? ` ${names}이(가) 팔레트에 나와요` : '');
  }
  if (r.earned) h += `<br>🎁 팔레트 +${r.earned}`;
  evalMissions(missionCtx(a, b)).forEach(m => { h += `<br>✅ 미션 완료! ${m.txt} (+${MISSION_GEMS[m.lv - 1]}💎)`; });
  if (S.event) {                                   // 특별 지휘관: 이기면 팔레트 보상
    if (a > b) { SAVE.palettes += S.event.pal; h += `<br>⚡ 특별 지휘관을 쓰러뜨렸어요! 🎁 팔레트 +${S.event.pal}`; }
    else h += `<br>⚡ 특별 지휘관에게 졌어요… 다음엔 꼭!`;
  }
  persist();
  $('pinfo').innerHTML = h; syncOpal();
}

function refreshHome() {

function rollGem() { let r = Math.random(); for (const g of PALETTE.gems) { r -= g[1]; if (r <= 0) return g[0]; } return PALETTE.gems[0][0]; }

function rollPalette() {                           // 팔레트 하나를 열어서 결과를 적용하고, 화면에 보여줄 내용을 돌려줌
  const pool = unlockedPool(SAVE.maxPower), unowned = pool.filter(k => !SAVE.owned.includes(k));
  const lockedColors = COLORS.filter(c => c.tier > 0 && !UNLOCKED.includes(c.id));
  let kind;
  if (unowned.length && SAVE.dry >= PALETTE.pity) kind = 'new';
  else {
    const r = Math.random();
    kind = r < PALETTE.char ? 'char' : r < PALETTE.char + PALETTE.color ? 'color' : 'gem';
    if (kind === 'color' && !lockedColors.length) kind = 'gem';
  }
  if (kind === 'new' || kind === 'char') {
    let id;
    if (kind === 'new') id = unowned[Math.floor(Math.random() * unowned.length)];
    else {
      const w = pool.map(k => SAVE.owned.includes(k) ? 1 : PALETTE.newWeight);
      let x = Math.random() * w.reduce((t, v) => t + v, 0);
      id = pool[0];
      for (let i = 0; i < pool.length; i++) { x -= w[i]; if (x <= 0) { id = pool[i]; break; } }
    }
    const d = CFG.UNITS[id];
    if (!SAVE.owned.includes(id)) {
      SAVE.owned.push(id); SAVE.dry = 0;
      if (SEL.length < MAX_PICK) { SEL.push(id); saveSel(); }
      return { icon: d.icon, unit: id, title: `새 캐릭터! ${d.name}`, sub: '이제 캐릭터 선택에서 쓸 수 있어요', cls: 'new' };
    }
    SAVE.dry++;
    if ((SAVE.augs[id] || []).length >= 5) { SAVE.gems += PALETTE.maxedGems; return { icon: d.icon, unit: id, title: `${d.name} 중복!`, sub: `증강을 모두 해금해서 보석 ${PALETTE.maxedGems}개로 바뀌었어요`, cls: 'dup' }; }
    SAVE.tickets[id] = (SAVE.tickets[id] || 0) + 1;
    return { icon: d.icon, unit: id, title: `${d.name} 중복!`, sub: `증강권 +1 (보유 ${SAVE.tickets[id]}장)`, cls: 'dup' };
  }
  SAVE.dry++;
  if (kind === 'color') {
    let cw = Math.random() * lockedColors.reduce((t, x) => t + (x.tier === 2 ? 1 : 3), 0), c = lockedColors[0];
    for (const x of lockedColors) { cw -= (x.tier === 2 ? 1 : 3); if (cw <= 0) { c = x; break; } }      // 전설 색은 희귀 색의 3분의 1 확률
    UNLOCKED.push(c.id); store('pk_colors', JSON.stringify(UNLOCKED));
    return { icon: '🎨', title: `새 색상! ${c.name}`, sub: '닉네임 · 색상에서 고를 수 있어요', cls: 'new' };
  }
  const n = rollGem(); SAVE.gems += n;
  return { icon: '💎', title: `보석 ${n}개`, sub: `보유 보석 ${SAVE.gems}개`, cls: n >= 150 ? 'jack' : '' };
}

function applyAug(u, listIn) {                             // 소환될 때 해금한 증강을 능력치에 반영 (같은 능력치의 %는 더하기로 합산)
  const list = listIn || SAVE.augs[u.type];
  if (!list || !list.length) return;
  u.au = list.slice();
  const D = u.d = Object.assign({}, u.d), A = n => list.includes(n), f = (...p) => 1 + p.reduce((t, x) => t + x, 0);
  switch (u.type) {
    case 'knight': D.hp = Math.round(D.hp * f(A(1) && .10, A(5) && .25)); D.atk *= f(A(5) && .25); if (A(4)) u.rr = .75; break;
    case 'archer': D.range *= f(A(2) && .12); if (A(3)) u.trailAug = 3; break;
    case 'titan': D.hp = Math.round(D.hp * f(A(2) && .1)); if (A(1)) D.rate /= 1.15; if (A(3)) u.vamp = .05; break;
    case 'chicken': if (A(1)) D.spd *= 1.1; D.hp = Math.round(D.hp * f(A(2) && .2)); if (A(3)) D.trail *= 1.25; break;
    case 'launcher': D.hp = Math.round(D.hp * f(A(1) && .1)); if (A(2)) D.rate *= .9; if (A(3)) D.boom *= 1.2; break;
    case 'fire': if (A(1)) D.turn *= .8; if (A(2)) D.range *= 1.15; if (A(3)) D.cone = 50; if (A(4)) { u.slowImm = true; D.hp = Math.round(D.hp * 1.1); } if (A(5)) D.atk *= 1.25; break;
    case 'assassin': if (A(1)) D.spd *= 1.1; if (A(2)) D.atk *= 1.15; if (A(3)) D.tp *= 1.25; break;
    case 'witch': if (A(2)) D.zoneTime *= 1.25; if (A(3)) D.zone *= 1.2; break;
    case 'mage': if (A(1)) D.rate *= .92; if (A(2)) D.range *= 1.1; if (A(3)) D.stun = .7; if (A(4)) { D.shield = 50; u.shLeak = true; } break;
    case 'castle': D.hp = Math.round(D.hp * f(A(1) && .1)); if (A(2)) D.range *= 1.15; if (A(4)) D.rate *= .9; break;
    case 'arma': if (A(1)) D.shield = 120; if (A(2)) u.thorn = .1; if (A(3)) D.cool = 1.5; if (A(5)) D.atk *= 1.4; break;
    case 'flower': D.hp = Math.round(D.hp * f(A(1) && .1)); if (A(2)) D.splash *= 1.15; if (A(3)) D.heal = .25; break;
  }
  u.hp = u.max = D.hp; u.shield = u.shMax = D.shield || 0;
}

function augTick(u, dt) {                          // 매 프레임 적용되는 증강 효과
  const A = n => u.au.includes(n);
  if (u.burstCd > 0) u.burstCd -= dt;
  if (u.burstT > 0) u.burstT -= dt;
  if (u.type === 'knight') {
    if (A(2) && S.units.some(o => o !== u && o.hp > 0 && o.team === u.team && o.type === 'knight' && Math.hypot(o.x - u.x, o.y - u.y) <= 70))
      u.hp = Math.min(u.max, u.hp + u.max * .02 * dt);                                // 집단지성
    const rage = A(3) && u.hp < u.max * .5;                                           // 멋있는 전사
    u.spdMul = rage ? 1.3 : 1; u.atkMul = rage ? 1.5 : 1;
  }
  if (u.type === 'chicken') {
    u.spdMul = u.burstT > 0 ? 1.4 : 1;                                                // 놀란 가슴
    if (A(5)) {                                                                       // 황금알
      u.eggT = (u.eggT === undefined ? EGG_EVERY : u.eggT) - dt;
      if (u.eggT <= 0) { u.eggT = EGG_EVERY; spawn(u.team, 'egg', u.x, u.y, true); S.fx.push({ x: u.x, y: u.y, t: 0, team: u.team, r: 8 }); }
    }
  }
  if (u.trailAug && (Math.abs(u.x - u.lx) > .01 || Math.abs(u.y - u.ly) > .01)) paint(u.x, u.y, u.trailAug, u.team);   // 다재다능
  u.lx = u.x; u.ly = u.y;
  if (u.backT > 0 && u.backTgt && !(u.stun > 0)) { u.backT -= dt; moveTo(u, 2 * u.x - u.backTgt.x, 2 * u.y - u.backTgt.y, dt); }   // 백스텝
}

function fireArrow(u, e) {                         // 궁수 공격 (파워샷, 관통, 백스텝)
  const D = u.d, au = u.au || [];
  u.shots = (u.shots || 0) + 1;
  const dmg = D.atk * (au.includes(5) && u.shots % 3 === 0 ? 1.4 : 1);
  if (au.includes(4)) {
    const dx = e.x - u.x, dy = e.y - u.y, d = Math.hypot(dx, dy) || 1;
    S.shots.push({ k: 'parrow', team: u.team, x: u.x, y: u.y, vx: dx / d, vy: dy / d, a: Math.atan2(dy, dx), left: D.range + 30, hit: [], dmg, d: D, src: u });
  } else S.shots.push({ k: 'arrow', team: u.team, x: u.x, y: u.y, tgt: e, tx: e.x, ty: e.y, dmg, a: 0, d: D, src: u });
  if (au.includes(1)) { u.backT = .2; u.backTgt = e; }
}

function castOrbs(u, e) {                          // 마녀 공격 (이중 저주, 깊은 저주)
  const D = u.d, A = n => u.au && u.au.includes(n), amp = A(4) ? .1 : 0;
  const mk = (t, m) => S.shots.push({ k: 'orb', team: u.team, x: u.x, y: u.y, tgt: t, tx: t.x, ty: t.y, dmg: D.atk * m, d: D, src: u, amp });

function boomAt(x, y, team, D, dmg, src, mul) {    // 페인트런처 폭발
  paint(x, y, D.boom, team);
  for (const e of S.units) if (e.team !== team && e.hp > 0 && Math.hypot(e.x - x, e.y - y) <= D.boom + e.d.r) hurt(e, dmg * mul, true, src);
  S.fx.push({ x, y, t: 0, team, r: D.boom });
}

function bloomAt(x, y, team, D, mul, src, slow, blossom) {   // 꽃순이 꽃 이펙트 (적 피해, 아군 회복, 만개)
  for (const e of S.units) {
    if (e.hp <= 0 || Math.hypot(e.x - x, e.y - y) > D.splash + e.d.r) continue;
    if (e.team === team) e.hp = Math.min(e.max, e.hp + e.max * D.heal * mul);
    else { hurt(e, D.atk * mul, true, src); if (slow && !e.slowImm && !(e.inv > 0)) e.slowT = 2; }
  }
  if (blossom) {
    const pts = [];
    for (let i = 0; i < 14; i++) { const a = Math.random() * TAU, r = D.splash * Math.sqrt(Math.random()); pts.push([Math.cos(a) * r, Math.sin(a) * r, 5 + Math.random() * 3]); }
    S.fx.push({ x, y, t: 0, team, life: .7, blossom: true, pts });
  } else S.fx.push({ x, y, t: 0, team, r: D.splash * .7, flower: true });
}

const AI_AUG_MULT = 1.0;                           // AI 증강 개수 배율 (1.0 = 같은 통솔력의 평균 플레이어와 같은 수, 올리면 AI가 더 세져요)
// 통솔력 0, 100, 200, ... 에서 평균적인 플레이어가 가진 증강 총 개수 (팔레트 확률 시뮬레이션 결과)
const AI_AUG = [0, 1.2, 2.1, 2.9, 3.7, 4.5, 5.4, 6.6, 8.1, 9.6, 11.2, 12.8, 14.4];
function rollAiAugs(focus) {                       // 이번 판 AI의 증강: 정확도가 높을수록 덱에 쓰는 캐릭터에 몰아줌
  const pool = unlockedPool(SAVE.maxPower), T = AI_AUG, x = SAVE.power / 100, i = Math.floor(x);
  const a = T[Math.min(i, T.length - 1)], b = T[Math.min(i + 1, T.length - 1)];
  let exp = a + (b - a) * (x - i);
  if (x > T.length - 1) exp += 1.6 * (x - (T.length - 1));
  if (S.event && S.event.type === 'aug') exp *= EVENT_AUG_MULT;
  exp = Math.min(exp * AI_AUG_MULT, pool.length * 5);
  let n = Math.floor(exp) + (Math.random() < exp - Math.floor(exp) ? 1 : 0);
  const fp = focus ? pool.filter(k => focus.includes(k)) : [], res = {};
  while (n > 0) {
    const src = (fp.length && Math.random() < (S.acc || 0)) ? fp : pool;
    let open = src.filter(k => (res[k] || []).length < 5 && AUG[k]);
    if (!open.length) open = pool.filter(k => (res[k] || []).length < 5 && AUG[k]);
    if (!open.length) break;
    const k = open[Math.floor(Math.random() * open.length)], have = res[k] || [];
    const cand = [1, 2, 3, 4, 5].filter(v => !have.includes(v)), w = cand.map(v => 6 - v);
    let r = Math.random() * w.reduce((t, v) => t + v, 0), pick = cand[0];
    for (let j = 0; j < cand.length; j++) { r -= w[j]; if (r <= 0) { pick = cand[j]; break; } }
    res[k] = have.concat(pick); n--;
  }
  return res;
}
